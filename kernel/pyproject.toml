[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cftuv-envelope-core"
version = "0.1.0"
description = "Blender-free public contracts for the CFTUV Envelope kernel"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CFTUV" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1", "pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
