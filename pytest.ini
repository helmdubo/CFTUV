[pytest]
# Чистый клон обязан быть зелёным. Тесты, помеченные ниже, исключены из
# обычного прогона по явной причине, а не потому что «так сложилось».
addopts = -m "not atlas_frozen" --strict-markers

markers =
    atlas_frozen: замороженная GL-pending приёмка атласа; исключена из обычного прогона
    requires_pyvoronoi: требует опциональной зависимости pyvoronoi (см. README «Decal dependency»)

# tests/blender/ запускается только внутри Blender: там нужны bpy и addon_utils.
norecursedirs = tests/blender .git artifacts docs
