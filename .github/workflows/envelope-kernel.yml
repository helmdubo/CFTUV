name: Envelope kernel contracts and reference evaluator

# История этого workflow: с 2026-08-04 он был красным на каждом пуше по двум причинам, которых никто не читал, пока красным было всё:
#   1. kernel-hermetic и kernel-extraction-readiness падали на сборе: два теста ядра читали `artifacts/p0_2*` из КОРНЯ репозитория,
#      то есть «извлечённое» ядро не было извлекаемым (ровно то, что job обязан был поймать). Артефакты теперь лежат в `kernel/artifacts/`.
#   2. blender-free-host-bridge-v0b держал белый список файлов хоста (sparse checkout), который отстал от графа импортов: отладочный
#      рендерер тянет ~65 модулей хоста. Изоляция этим списком давно не доказывалась; границы слоёв держит tests/test_architecture.py.
#
# Матрица Python. Чистое ядро заявляет `requires-python >=3.10` (kernel/pyproject.toml), а интерпретатор продукта — CPython 3.11
# (Blender 4.5; на нём же собирается нативное колесо `abi3-py311`). Поэтому колесо ядра проверяется на обеих: 3.10 держит заявленный
# пол, 3.11 — то, что исполняется у владельца. Проверку матрицы держит tests/test_architecture.py
# (`test_the_python_matrix_covers_the_declared_floor_and_the_blender_interpreter`). Нативную сборку (колесо Rust, cargo test,
# дифференциальные тесты без пропусков) этот workflow НЕ проверяет: она живёт в .github/workflows/native.yml.

on:
  push:
    paths:
      - "kernel/**"
      - "cftuv/envelope_*.py"
      - "cftuv/envelope_host_adapter.py"
      - "cftuv/envelope_debug_renderer.py"
      - "cftuv/debug.py"
      - "cftuv/operators.py"
      - "tests/requirements.txt"
      - "tests/test_envelope_host_adapter.py"
      - "tests/test_envelope_debug_renderer_contract.py"
      - "tests/blender/test_envelope_debug_bridge.py"
      - ".github/workflows/envelope-kernel.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "cftuv/envelope_*.py"
      - "cftuv/envelope_host_adapter.py"
      - "cftuv/envelope_debug_renderer.py"
      - "cftuv/debug.py"
      - "cftuv/operators.py"
      - "tests/requirements.txt"
      - "tests/test_envelope_host_adapter.py"
      - "tests/test_envelope_debug_renderer_contract.py"
      - "tests/blender/test_envelope_debug_bridge.py"
      - ".github/workflows/envelope-kernel.yml"

jobs:
  kernel-hermetic:
    name: kernel-hermetic (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kernel
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel kernel
      - name: Test wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/kernel-wheel-venv"
          STANDALONE="$RUNNER_TEMP/kernel-wheel-tests"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check kernel/dist/*.whl pytest
          mkdir -p "$STANDALONE"
          cp -R kernel/tests kernel/fixtures kernel/schema kernel/artifacts "$STANDALONE/"
          cd "$STANDALONE"
          env -u PYTHONPATH "$VENV/bin/python" -I -m pytest -q -p no:cacheprovider tests

  kernel-extraction-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: kernel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Copy kernel into an empty repository
        shell: bash
        run: |
          set -euo pipefail
          EXTRACTED="$RUNNER_TEMP/extracted-kernel"
          mkdir -p "$EXTRACTED"
          cp -R kernel/. "$EXTRACTED/"
          cd "$EXTRACTED"
          git init
          git config user.name "Envelope CI"
          git config user.email "envelope-ci@example.invalid"
          git add .
          git commit -m "extracted kernel"
      - name: Build and test extracted package
        shell: bash
        run: |
          set -euo pipefail
          EXTRACTED="$RUNNER_TEMP/extracted-kernel"
          VENV="$RUNNER_TEMP/extracted-kernel-venv"
          python -m pip install --disable-pip-version-check build
          python -m build --wheel "$EXTRACTED"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check "$EXTRACTED"/dist/*.whl pytest
          cd "$EXTRACTED"
          env -u PYTHONPATH "$VENV/bin/python" -I -m pytest -q -p no:cacheprovider tests
          env -u PYTHONPATH "$VENV/bin/python" -I tools/check_forbidden_imports.py src/cftuv_envelope
          env -u PYTHONPATH "$VENV/bin/python" -I tools/sync_session_a_fixtures.py --check --fixture-root fixtures/session_a_v5
          test -z "$(git status --porcelain)"

  # Мост AnalysisBundle -> DebugScene без Blender. Раньше checkout сводился к белому списку файлов хоста; список отстал от графа
  # импортов (рендерер тянет ~65 модулей), поэтому checkout полный, а изоляцию слоёв держат архитектурные тесты хоста.
  blender-free-host-bridge-v0b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact host-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Test AnalysisBundle to DebugScene bridge
        env:
          PYTHONPATH: kernel/src
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_envelope_host_adapter.py \
            tests/test_envelope_debug_renderer_contract.py
      - name: Prove debug bridge does not import legacy decal geometry
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          imports = set()
          for path in (
              Path("cftuv/envelope_debug_session.py"),
              Path("cftuv/envelope_host_adapter.py"),
              Path("cftuv/envelope_metric_export.py"),
              Path("cftuv/envelope_request_export.py"),
              Path("cftuv/envelope_topology_export.py"),
              Path("cftuv/envelope_debug_renderer.py"),
          ):
              tree = ast.parse(
                  path.read_text(encoding="utf-8"),
                  filename=str(path),
              )
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.add(node.module or "")
          forbidden = {
              "cftuv.decal_voronoi",
              "cftuv.decals",
              "decal_voronoi",
              "decals",
          }
          found = sorted(imports & forbidden)
          if found:
              raise SystemExit(f"forbidden host-adapter imports: {found}")
          print("Envelope debug bridge legacy-import scan: OK")
          PY
