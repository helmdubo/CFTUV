version: 2

goal:
  title: "Surface-Conforming CFTUV Decals"
  slug: "surface-conforming-decals"
  kind: existing_plan
  tranche: "Implement four substantial user-testable slices until every decal mode uses an oriented surface-following ribbon pipeline."
  status: active
  oracle:
    signal: "Automated ribbon invariants plus the staged Blender walkthrough prove arbitrary planar angles, local-normal following, curved-width conformance, and stable closed loops across all decal modes."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts for all four slices, passing automated checks, clean compile/import checks, and a final audit mapping the documented Blender walkthrough to the original request."
  intake:
    original_request: "Break the agreed surface-conforming decal work into substantial user-testable slices and execute it autonomously."
    interpreted_outcome: "All CFTUV decals are generated by one chain-aware ribbon system that follows actual owner-patch geometry without mirroring or fixed-angle wings."
    input_shape: existing_plan
    audience: "CFTUV Blender user"
    authority: approved
    proof_type: test
    completion_proof: "Tests and Blender acceptance steps cover the four observable slices and final audit records full_outcome_complete: true."
    likely_misfire: "A refactor passes helper tests but decals still float, mirror, join through point contacts, or ignore local geometry in Blender."
    blind_spots_considered:
      - "Patch-average normals cannot represent local geometry."
      - "Normals at the spine alone cannot make a wide wing follow curvature."
      - "Vertex-only adjacency can join unrelated chain runs."
      - "Closed loops require winding and semantic UV checks, not only endpoint welding."
      - "Closest-point projection can jump across folds unless constrained to the owner patch and bounded."
    existing_plan_facts:
      - "Keep BoundaryChain atomic and oriented."
      - "Use a shared OrientedRibbonRun/RibbonBuilder abstraction."
      - "Produce local surface frames in analysis, not decals.py."
      - "Use one-sided ribbons for TOP/BOTTOM/boundary and two-sided ribbons for CORNERS/SEAMS."
      - "Subdivide and project width samples for genuine curved-surface conformance."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

