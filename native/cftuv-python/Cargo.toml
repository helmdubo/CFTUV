[package]
name = "cftuv-python"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cftuv-clip = { path = "../cftuv-clip" }
cftuv-core = { path = "../cftuv-core" }
cftuv-canon = { path = "../cftuv-canon" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
mimalloc = { version = "0.1", default-features = false }
# the digest of the Rust sources (`digest.rs`, shared with `build.rs`): `native_build_id()`
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
sha2 = { version = "0.10", default-features = false }
