[package]
name = "cftuv-python"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
cftuv-angular = { path = "../cftuv-angular" }
cftuv-alpha = { path = "../cftuv-alpha" }
cftuv-clip = { path = "../cftuv-clip" }
cftuv-core = { path = "../cftuv-core" }
cftuv-density = { path = "../cftuv-density" }
cftuv-embedding = { path = "../cftuv-embedding" }
cftuv-frame = { path = "../cftuv-frame" }
cftuv-mesh = { path = "../cftuv-mesh" }
cftuv-canon = { path = "../cftuv-canon" }
cftuv-radical = { path = "../cftuv-radical" }
cftuv-skeleton = { path = "../cftuv-skeleton" }
cftuv-snapshot = { path = "../cftuv-snapshot" }
cftuv-station = { path = "../cftuv-station" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
mimalloc = { version = "0.1", default-features = false }
# the digest of the Rust sources (`digest.rs`, shared with `build.rs`): `native_build_id()`
sha2 = { version = "0.10", default-features = false }

[features]
# the phase timers of the skeleton leaf (answered with the evaluate seam); off in the wheel the product installs
skeleton-profile = ["cftuv-skeleton/profile"]

[build-dependencies]
sha2 = { version = "0.10", default-features = false }
