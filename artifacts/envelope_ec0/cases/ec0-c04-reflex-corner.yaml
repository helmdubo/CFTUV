schema: cftuv.envelope.ec0.case.v1
case_id: EC0-C04
slug: reflex-corner
title: Reflex corner without exterior wedge
status: DEFINED
semantic_contracts:
  - id: C04-S1
    authority: USER_REQUIRED
    rule: A reflex corner uses the union of incident strip matter and does not create an exterior corner wedge.
  - id: C04-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: The inner seam is an adjacency/interface inside coverage and never a second layer of matter.
  - id: C04-S3
    authority: FIELD_PROVEN
    rule: Winding or normal reversal cannot invert reflex and convex behavior.
skeleton:
  nodes:
    - {id: start, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: turn, kind: CORNER, roles: [REFLEX]}
    - {id: end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
  edges:
    - {id: incoming, kind: SELECTED_SPINE, from: start, to: turn}
    - {id: outgoing, kind: SELECTED_SPINE, from: turn, to: end}
envelopes:
  - {id: strip_in, kind: StripEnvelope, source: incoming, alpha_law: TWO_SIDED_LINEAR}
  - {id: strip_out, kind: StripEnvelope, source: outgoing, alpha_law: TWO_SIDED_LINEAR}
  - {id: corner, kind: CornerEnvelope, source: turn, join: REFLEX_UNION, alpha_law: NO_EXTERIOR_WEDGE}
region_graph:
  regions:
    - {id: incoming_region, semantic_kind: STRIP, owner: strip_in, station_model: INCOMING_S}
    - {id: reflex_region, semantic_kind: CORNER, owner: corner, station_model: CORNER_CONTINUATION}
    - {id: outgoing_region, semantic_kind: STRIP, owner: strip_out, station_model: OUTGOING_S}
  edges:
    - {regions: [incoming_region, reflex_region], kind: INTERNAL_INTERFACE}
    - {regions: [reflex_region, outgoing_region], kind: INTERNAL_INTERFACE}
boundary_lineage:
  - {boundary: outer_incoming, lineage: [strip_in, incoming], role: COVERAGE_SILHOUETTE}
  - {boundary: outer_outgoing, lineage: [strip_out, outgoing], role: COVERAGE_SILHOUETTE}
  - {boundary: reflex_interface, lineage: [corner, turn, REFLEX], role: INTERNAL_ADJACENCY}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: incoming_region, b: reflex_region, through: REFLEX_IN}
  - {a: reflex_region, b: outgoing_region, through: REFLEX_OUT}
s_direction:
  authority: ROUTE_CONTINUATION_THROUGH_CORNER
  corner_rule: MONOTONE_NO_RESET
  uv_mapping: {longitudinal: s, transverse: r}
alpha_evolution:
  - {stage: alpha_zero, coverage: POLYLINE_SKELETON, topology: NO_REGION}
  - {stage: alpha_positive, coverage: INCIDENT_STRIP_UNION, topology: SINGLE_COVERAGE_COMPONENT}
  - {stage: alpha_larger, coverage: SAME_REFLEX_LAW, topology: UNCHANGED_UNTIL_DECLARED_EVENT}
topology_events:
  - {id: birth, kind: BIRTH, height: ALPHA_ZERO, application: CLOSED_AT_AND_AFTER}
forbidden:
  - CONVEX_BEVEL_OR_MITER_WEDGE_AT_REFLEX_CORNER
  - NORMAL_SIGN_SELECTS_CORNER_CLASS
  - DOUBLE_COVER_IN_REFLEX_OVERLAP
  - TAPER_TO_ZERO_AT_TURN
metamorphic_expectations:
  matrix_row: EC0-C04
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors]
  exclude: [face_order, tessellation, normal_sign, overlapping_runtime_faces]
visuals:
  svg: artifacts/envelope_ec0/sheets/ec0-c04-reflex-corner.svg
  png: artifacts/envelope_ec0/sheets/ec0-c04-reflex-corner.png

