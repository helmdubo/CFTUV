schema: cftuv.envelope.ec0.case.v1
case_id: EC0-C02
slug: convex-miter-corner
title: Convex MITER corner
status: DEFINED
semantic_contracts:
  - id: C02-S1
    authority: USER_REQUIRED
    rule: MITER corner matter reaches the unique apex derived from the two incident strip supports.
  - id: C02-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: Coverage is the union of incident strips and one CornerEnvelope; internal ownership cannot alter the silhouette.
  - id: C02-S3
    authority: USER_REQUIRED
    rule: The corner model is selected at compile time and supplies one boundary to coverage, ownership, UV, and emission.
skeleton:
  nodes:
    - {id: start, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: turn, kind: CORNER, roles: [CONVEX, MITER]}
    - {id: end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
  edges:
    - {id: incoming, kind: SELECTED_SPINE, from: start, to: turn}
    - {id: outgoing, kind: SELECTED_SPINE, from: turn, to: end}
envelopes:
  - {id: strip_in, kind: StripEnvelope, source: incoming, alpha_law: TWO_SIDED_LINEAR}
  - {id: strip_out, kind: StripEnvelope, source: outgoing, alpha_law: TWO_SIDED_LINEAR}
  - {id: corner, kind: CornerEnvelope, source: turn, join: MITER, alpha_law: SUPPORT_INTERSECTION}
region_graph:
  regions:
    - {id: incoming_region, semantic_kind: STRIP, owner: strip_in, station_model: INCOMING_S}
    - {id: corner_region, semantic_kind: CORNER, owner: corner, station_model: CORNER_CONTINUATION}
    - {id: outgoing_region, semantic_kind: STRIP, owner: strip_out, station_model: OUTGOING_S}
  edges:
    - {regions: [incoming_region, corner_region], kind: CORNER_INTERFACE}
    - {regions: [corner_region, outgoing_region], kind: CORNER_INTERFACE}
boundary_lineage:
  - {boundary: inner_join, lineage: [strip_in, strip_out, turn, INNER], role: COVERAGE_SILHOUETTE}
  - {boundary: outer_miter_a, lineage: [corner, incoming, OUTER], role: COVERAGE_SILHOUETTE}
  - {boundary: outer_miter_b, lineage: [corner, outgoing, OUTER], role: COVERAGE_SILHOUETTE}
  - {boundary: apex, lineage: [corner, turn, MITER_APEX], role: SEMANTIC_ANCHOR}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: incoming_region, b: corner_region, through: P1_INTERFACE}
  - {a: corner_region, b: outgoing_region, through: P2_INTERFACE}
s_direction:
  authority: ROUTE_CONTINUATION_THROUGH_CORNER
  corner_rule: MONOTONE_FROM_INCOMING_TO_OUTGOING
  uv_mapping: {longitudinal: s, transverse: r}
alpha_evolution:
  - {stage: alpha_zero, coverage: POLYLINE_SKELETON, topology: NO_REGION}
  - {stage: alpha_positive, coverage: MITER_APEX_PRESENT, topology: THREE_SEMANTIC_REGIONS}
  - {stage: alpha_larger, coverage: SAME_JOIN_LAW_SCALED, topology: UNCHANGED_UNTIL_DECLARED_EVENT}
topology_events:
  - {id: birth, kind: BIRTH, height: ALPHA_ZERO, application: CLOSED_AT_AND_AFTER}
forbidden:
  - ROUND_FAN_SUBSTITUTION
  - POST_UNION_APEX_PATCH
  - OWNER_DIVIDER_IN_COVERAGE_SILHOUETTE
  - JOIN_SWITCH_DURING_RAW_DRAG
metamorphic_expectations:
  matrix_row: EC0-C02
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, corner_join_switch]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, join]
  exclude: [face_order, tessellation, sampled_arc, implementation_site_ids]
visuals:
  svg: artifacts/envelope_ec0/sheets/ec0-c02-convex-miter-corner.svg
  png: artifacts/envelope_ec0/sheets/ec0-c02-convex-miter-corner.png

