schema: cftuv.envelope.ec0.case.v1
case_id: EC0-C12
slug: curved-internal-divider
title: Curved ownership divider inside unchanged coverage
status: DEFINED
semantic_contracts:
  - id: C12-S1
    authority: MATHEMATICALLY_REQUIRED
    rule: An exact curved equality locus may partition ownership inside a component but cannot contribute to the coverage silhouette.
  - id: C12-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: Coverage remains the exact union of contributing envelopes on both sides of the divider.
  - id: C12-S3
    authority: USER_REQUIRED
    rule: Divider lineage retains both competing primitive claims and the station or UV models that induced it.
skeleton:
  nodes:
    - {id: source_a_start, kind: PHYSICAL_ENDPOINT, roles: [A_START]}
    - {id: source_a_end, kind: PHYSICAL_ENDPOINT, roles: [A_END]}
    - {id: source_b, kind: CORNER, roles: [LOCAL_CLAIM_B]}
  edges:
    - {id: source_a, kind: SELECTED_SPINE, from: source_a_start, to: source_a_end}
envelopes:
  - {id: envelope_a, kind: StripEnvelope, source: source_a, alpha_law: TWO_SIDED_LINEAR}
  - {id: envelope_b, kind: CornerEnvelope, source: source_b, alpha_law: LOCAL_CORNER_CLAIM}
region_graph:
  regions:
    - {id: owner_a_region, semantic_kind: STRIP_CLAIM, owner: envelope_a, station_model: A_S}
    - {id: owner_b_region, semantic_kind: CORNER_CLAIM, owner: envelope_b, station_model: B_S}
  edges:
    - {regions: [owner_a_region, owner_b_region], kind: CURVED_OWNERSHIP_DIVIDER}
boundary_lineage:
  - {boundary: outer_union, lineage: [envelope_a, envelope_b], role: COVERAGE_SILHOUETTE}
  - {boundary: equality_locus, lineage: [envelope_a, envelope_b, EXACT_EQUALITY], role: OWNERSHIP_DIVIDER}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: owner_a_region, b: owner_b_region, through: equality_locus}
s_direction:
  authority: OWNER_LOCAL_STATION_MODELS
  across_divider: EXPLICIT_UV_OR_STATION_INTERFACE
  reconstruction_after_boolean: FORBIDDEN
alpha_evolution:
  - {stage: before_overlap, coverage: DISJOINT_OR_TOUCHING_CLAIMS, topology: NO_DIVIDER}
  - {stage: divider_birth, coverage: UNION_UNCHANGED_BY_DIVIDER, topology: DIVIDER_BIRTH_EVENT}
  - {stage: after_birth, coverage: UNION_EVOLVES_BY_ENVELOPES_ONLY, topology: CURVED_DIVIDER_INTERNAL}
topology_events:
  - {id: divider_birth, kind: BIRTH, height: ALPHA_EQUALITY_BECOMES_INTERIOR, application: CLOSED_AT_AND_AFTER}
forbidden:
  - CURVED_DIVIDER_IN_COVERAGE_SILHOUETTE
  - SAMPLED_PARABOLA_AS_TOPOLOGY_AUTHORITY
  - PROVENANCE_RECONSTRUCTION_AFTER_BOOLEAN
  - TOLERANCE_SELECTS_OWNER
metamorphic_expectations:
  matrix_row: EC0-C12
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, exact_curve_identity]
  exclude: [face_order, tessellation, sampled_polyline, reconstructed_nearest_source]
visuals:
  svg: artifacts/envelope_ec0/sheets/ec0-c12-curved-internal-divider.svg
  png: artifacts/envelope_ec0/sheets/ec0-c12-curved-internal-divider.png

