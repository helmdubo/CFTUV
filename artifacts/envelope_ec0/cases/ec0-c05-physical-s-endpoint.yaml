schema: cftuv.envelope.ec0.case.v1
case_id: EC0-C05
slug: physical-s-endpoint
title: Physical end of s and CapEnvelope
status: DEFINED
semantic_contracts:
  - id: C05-S1
    authority: FIELD_PROVEN
    rule: A CapEnvelope is born only at a physical semantic line end, not at a data-chain record boundary.
  - id: C05-S2
    authority: USER_REQUIRED
    rule: The cap is a cut of the strip itself; it is never an overlay face or a second coverage layer.
  - id: C05-S3
    authority: MATHEMATICALLY_REQUIRED
    rule: s is constant on the physical cap and does not reset or extrapolate beyond the endpoint.
skeleton:
  nodes:
    - {id: upstream, kind: CONTINUATION, roles: [SEMANTIC_START_SIDE]}
    - {id: physical_end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
  edges:
    - {id: spine, kind: SELECTED_SPINE, from: upstream, to: physical_end}
envelopes:
  - {id: strip, kind: StripEnvelope, source: spine, alpha_law: TWO_SIDED_LINEAR}
  - {id: cap, kind: CapEnvelope, source: physical_end, alpha_law: END_CLOSURE}
region_graph:
  regions:
    - {id: body, semantic_kind: STRIP, owner: strip, station_model: SPINE_S}
    - {id: cap_region, semantic_kind: CAP, owner: cap, station_model: CONSTANT_END_S}
  edges:
    - {regions: [body, cap_region], kind: END_INTERFACE}
boundary_lineage:
  - {boundary: side_left, lineage: [strip, spine, LEFT], role: COVERAGE_SILHOUETTE}
  - {boundary: side_right, lineage: [strip, spine, RIGHT], role: COVERAGE_SILHOUETTE}
  - {boundary: physical_end_cut, lineage: [cap, physical_end], role: COVERAGE_SILHOUETTE}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: body, b: cap_region, through: PHYSICAL_END_INTERFACE}
s_direction:
  authority: SEMANTIC_START_TO_PHYSICAL_END
  cap_station: CONSTANT_AT_END
  data_boundary_effect: NONE
alpha_evolution:
  - {stage: before_positive_width, coverage: ZERO_MEASURE_SKELETON, topology: NO_REGION}
  - {stage: positive_width, coverage: STRIP_CLOSED_BY_CAP, topology: BODY_PLUS_CAP}
  - {stage: larger_width, coverage: CAP_MOVES_BY_DECLARED_LAW_ONLY, topology: UNCHANGED_UNTIL_DOMAIN_EVENT}
topology_events:
  - {id: cap_birth, kind: BIRTH, height: ALPHA_ZERO, application: CLOSED_AT_AND_AFTER}
forbidden:
  - CAP_AT_DATA_CHAIN_SPLIT
  - S_RESET_AT_CAP_INTERFACE
  - TERMINAL_OVERLAY_FACE
  - CONTINUATION_PAST_PHYSICAL_END
metamorphic_expectations:
  matrix_row: EC0-C05
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors]
  exclude: [face_order, tessellation, data_chain_end_markers, overlay_faces]
visuals:
  svg: artifacts/envelope_ec0/sheets/ec0-c05-physical-s-endpoint.svg
  png: artifacts/envelope_ec0/sheets/ec0-c05-physical-s-endpoint.png

