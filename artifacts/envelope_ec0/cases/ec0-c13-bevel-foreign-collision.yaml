schema: cftuv.envelope.ec0.case.v1
case_id: EC0-C13
slug: bevel-foreign-collision
title: Another wing of the same decal collides with a BEVEL corner
status: DEFINED
scope:
  decal_identity: SAME_DECAL_REQUIRED
  owner_patch: SINGLE_PATCH_REQUIRED
  participants: PCHAIN_WING_FRONTS
  cross_decal_interaction: FORBIDDEN
semantic_contracts:
  - id: C13-S1
    authority: FIELD_PROVEN
    rule: Another arrived wing of the same decal and Patch may fill the wedge released by BEVEL and must stop on the actual P1-P2 chord.
  - id: C13-S2
    authority: FIELD_PROVEN
    rule: The other-wing interaction is gated by mutual arrival; an unarrived wing cannot round or cut the silhouette.
  - id: C13-S3
    authority: USER_REQUIRED
    rule: Own incident strip coverage is identical to MITER; the BEVEL triangle remains owned by its CornerEnvelope.
  - id: C13-S4
    authority: USER_REQUIRED
    rule: Collision participants always belong to one decal and one owner Patch; different decals and different Patches never interact.
skeleton:
  patch:
    id: owner_patch
    role: OFFSET_DOMAIN
  decal:
    id: same_decal
    owner_patch: owner_patch
  nodes:
    - {id: own_start, kind: PHYSICAL_ENDPOINT, roles: [OWN_SEMANTIC_START]}
    - {id: turn, kind: CORNER, roles: [CONVEX, BEVEL]}
    - {id: own_end, kind: PHYSICAL_ENDPOINT, roles: [OWN_SEMANTIC_END]}
    - {id: other_wing_start, kind: PHYSICAL_ENDPOINT, roles: [OTHER_PCHAIN_WING_SOURCE]}
    - {id: other_wing_end, kind: PHYSICAL_ENDPOINT, roles: [OTHER_PCHAIN_WING_END]}
  edges:
    - {id: own_in, kind: SELECTED_SPINE, from: own_start, to: turn}
    - {id: own_out, kind: SELECTED_SPINE, from: turn, to: own_end}
    - {id: other_wing, kind: SELECTED_SPINE, from: other_wing_start, to: other_wing_end, decal: same_decal, patch: owner_patch}
envelopes:
  - {id: own_strip_in, kind: StripEnvelope, source: own_in, alpha_law: TWO_SIDED_LINEAR}
  - {id: own_strip_out, kind: StripEnvelope, source: own_out, alpha_law: TWO_SIDED_LINEAR}
  - {id: bevel_corner, kind: CornerEnvelope, source: turn, join: BEVEL, semantic_anchors: [V, P1, P2], alpha_law: CHORD_CLOSURE}
  - {id: other_wing_strip, kind: StripEnvelope, source: other_wing, alpha_law: TWO_SIDED_LINEAR}
region_graph:
  regions:
    - {id: own_region, semantic_kind: STRIP, owner: OWN_STRIPS, station_model: OWN_S}
    - {id: bevel_region, semantic_kind: CORNER, owner: bevel_corner, station_model: OWN_CORNER_S}
    - {id: other_wing_region, semantic_kind: STRIP, owner: other_wing_strip, station_model: OTHER_WING_S}
  edges:
    - {regions: [own_region, bevel_region], kind: CORNER_INTERFACE}
    - {regions: [bevel_region, other_wing_region], kind: COLLISION_ON_BEVEL_CHORD, active: AFTER_MUTUAL_ARRIVAL}
boundary_lineage:
  - {boundary: bevel_chord, lineage: [bevel_corner, P1, P2], role: COVERAGE_AND_COLLISION_BOUNDARY}
  - {boundary: other_wing_front_before_meet, lineage: [other_wing_strip, alpha], role: COVERAGE_SILHOUETTE}
  - {boundary: contact_after_meet, lineage: [other_wing_strip, bevel_corner, bevel_chord], role: OWNERSHIP_ADJACENCY}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: bevel_region, b: other_wing_region, through: contact_after_meet}
s_direction:
  authority: OWNER_LOCAL_STATION_MODELS
  collision_effect: NONE_ON_BEVEL_S_AND_OTHER_WING_S
  chord_stations: RETAIN_P1_P2_PROVENANCE
alpha_evolution:
  - {stage: before_mutual_arrival, coverage: OTHER_WING_FRONT_FREE_AND_BEVEL_UNCUT, topology: NO_COLLISION_ADJACENCY}
  - {stage: at_mutual_arrival, coverage: FIRST_CONTACT_ON_CHORD, topology: CONTACT_BIRTH}
  - {stage: after_mutual_arrival, coverage: OTHER_WING_REACHES_CHORD, topology: DISJOINT_STATION_CLAIMS}
topology_events:
  - {id: mutual_arrival, kind: FREEZE, height: ALPHA_MEET, application: CLOSED_AT_AND_AFTER}
forbidden:
  - OTHER_WING_FRONT_ORBITS_MISSING_MITER_APEX
  - FAN_OR_ARC_BITE_AT_BEVEL
  - COLLISION_BEFORE_MUTUAL_ARRIVAL
  - BEVEL_CHANGES_OWN_STRIP_COVERAGE
  - CROSS_DECAL_COLLISION_PARTICIPANT
  - CROSS_PATCH_WING_INTERACTION
metamorphic_expectations:
  matrix_row: EC0-C13
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, corner_join_switch]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, interaction_state, join]
  exclude: [face_order, tessellation, missing_miter_apex, sampled_fan]
visuals:
  svg: artifacts/envelope_ec0/sheets/ec0-c13-bevel-foreign-collision.svg
  png: artifacts/envelope_ec0/sheets/ec0-c13-bevel-foreign-collision.png
