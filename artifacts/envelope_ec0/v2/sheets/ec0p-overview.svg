20" y="34" class="id">EC0-C11</text><text x="20" y="62" class="name">Corner owner on a short segment</text><g transform="translate(67 92) scale(1.02)"><path d="M 45 35 L 165 35" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="45" cy="35" r="14" fill="none" stroke="#e6a23c" stroke-width="5"/><circle cx="165" cy="35" r="14" fill="none" stroke="#e6a23c" stroke-width="5"/></g><text x="20" y="203" class="tiny">BODY_BETWEEN_CORNERS → BODY_COLLAPSED_SINGLE_COVER</text></g><g transform="translate(1194 598)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C12</text><text x="20" y="62" class="name">Curved internal divider</text><g transform="translate(67 92) scale(1.02)"><rect x="0" y="5" width="210" height="65" rx="22" fill="#dbeefa"/><path d="M 105 5 C 65 26 145 50 105 70" fill="none" stroke="#e6a23c" stroke-width="5"/></g><text x="20" y="203" class="tiny">SEPARATE_CLAIMS → DIVIDER_STAYS_INTERNAL</text></g><g transform="translate(36 852)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C13</text><text x="20" y="62" class="name">BEVEL under another-wing collision</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 70 L 92 70 L 92 0" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 176 8 L 118 58" fill="none" stroke="#cc4e9b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">OTHER_WING_FREE → CLIPPED_AT_ACTUAL_CHORD</text></g><g transform="translate(422 852)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C14</text><text x="20" y="62" class="name">Proven capacity saturation</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">BELOW_CAPACITY → PRIMARY_FROZEN_COMPANION_CONTINUES</text></g><g transform="translate(808 852)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C15</text><text x="20" y="62" class="name">Topology changes during drag</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">BEFORE_EVENT_BATCH → PRIMARY_DONE_COMPANION_CONTINUES</text></g><g transform="translate(1194 852)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C16</text><text x="20" y="62" class="name">Same-decal wing collision and self-collision</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 18 L 92 38" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 210 18 L 118 38" fill="none" stroke="#83c99b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 105 0 L 105 76" fill="none" stroke="#e6a23c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/></g><text x="20" y="203" class="tiny">INDEPENDENT_GROWTH → STABLE_B_COVERAGE_CLIP</text></g></svg>