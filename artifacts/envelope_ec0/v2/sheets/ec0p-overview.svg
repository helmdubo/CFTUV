<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172333}.head{font-size:34px;font-weight:700}.id{font-size:17px;font-weight:750;fill:#2f7bbd}.name{font-size:15px;font-weight:600}.tiny{font-size:11px;fill:#5d7282}</style><rect width="1600" height="1160" fill="#edf3f7"/><text x="36" y="48" class="head">EC0-P v2 · 16 canonical cases</text><text x="36" y="74" class="tiny">Each card expands into seven explicit layers: domain → source identity → seeds/fronts → boundary resolution → patch union/interactions → ownership/UV → alpha events.</text><g transform="translate(36 90)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C01</text><text x="20" y="62" class="name">Straight open strip</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">SKELETON → SAME_TOPOLOGY_WIDER</text></g><g transform="translate(422 90)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C02</text><text x="20" y="62" class="name">Convex MITER corner</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 70 L 92 70 L 92 0" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">POLYLINE → SAME_JOIN_LAW</text></g><g transform="translate(808 90)"><rect width="352" height="222" rx="18" fill="#fff" stroke="#bfd0dc"/><text x="20" y="34" class="id">EC0-C03</text><text x="20" y="62" class="name">Convex BEVEL corner</text><g transform="translate(67 92) scale(1.02)"><path d="M 0 70 L 92 70 L 92 0" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="20" y="203" class="tiny">POLYLINE → CHORD_MOVES_BY_POLICY</text></g><g