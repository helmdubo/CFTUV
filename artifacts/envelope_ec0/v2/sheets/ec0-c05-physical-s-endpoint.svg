  <rect x="42" y="112" width="1516" height="124" rx="18" fill="#ffffff" stroke="#c7d4df"/><rect x="42" y="112" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="154" class="lane">1  PATCHDOMAIN</text><g transform="translate(312 134) scale(0.72)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="500" y="150" class="main">One owner Patch is the only propagation field</text><text x="500" y="185" class="sub">domain_main · outer/holes/barriers · sectors for every directed use</text><rect x="42" y="254" width="1516" height="124" rx="18" fill="#f6f9fc" stroke="#c7d4df"/><rect x="42" y="254" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="296" class="lane">2  SOURCE IDENTITY</text><g transform="translate(312 276) scale(0.72)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="500" y="292" class="main">PhysicalChain is identity; ChainUse is directed patch-side meaning</text><text x="500" y="327" class="sub">route  →  route_use</text><path d="M 345 346 L 444 346" stroke="#2f7bbd" stroke-width="4" marker-end="url(#arrow)"/><rect x="42" y="396" width="1516" height="124" rx="18" fill="#ffffff" stroke="#c7d4df"/><rect x="42" y="396" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="438" class="lane">3  SEEDS + FRONTS</text><g transform="translate(312 418) scale(0.72)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="500" y="434" class="main">Compile-static seeds create independently tracked FrontComponents</text><text x="500" y="469" class="sub">CAP_SEED_END + FrontSeed per use · one component per (use, Patch, sector)</text><rect x="42" y="538" width="1516" height="124" rx="18" fill="#f6f9fc" stroke="#c7d4df"/><rect x="42" y="538" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="580" class="lane">4  BOUNDARY</text><g transform="translate(312 560) scale(0.72)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="500" y="576" class="main">Resolve outer boundary, holes and explicit BARRIER before union</text><text x="500" y="611" class="sub">exact clip/contact ledger; no private pChain domain and no rollback</text><rect x="42" y="680" width="1516" height="124" rx="18" fill="#ffffff" stroke="#c7d4df"/><rect x="42" y="680" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="722" class="lane">5  PATCH UNION</text><g transform="translate(312 702) scale(0.72)"><rect x="-10" y="-8" width="230" height="86" rx="36" fill="#dbeefa" stroke="#79add1" stroke-width="2" opacity="0.92"/><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 10 72 L 200 72" stroke="#83c99b" stroke-width="5" stroke-linecap="round" opacity="0.7"/></g><text x="500" y="718" class="main">All contributions of this Patch are evaluated together</text><text x="500" y="753" class="sub">strip closes only at the physical endpoint</text><rect x="1322" y="706" width="190" height="72" rx="15" fill="#e8f5ec" stroke="#83c99b"/><text x="1417" y="737" text-anchor="middle" class="badge">ONE PATCH</text><text x="1417" y="762" text-anchor="middle" class="badge">SINGLE COVER</text><rect x="42" y="822" width="1516" height="124" rx="18" fill="#f6f9fc" stroke="#c7d4df"/><rect x="42" y="822" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="864" class="lane">6  OWNERSHIP + UV</text><g transform="translate(312 844) scale(0.72)"><g><rect x="-8" y="2" width="100" height="68" rx="18" fill="#dbeefa" stroke="#79add1" stroke-width="2"/><path d="M 42 4 L 42 68" stroke="#e6a23c" stroke-width="4"/><g transform="translate(-2 17) scale(0.43)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g></g><g><rect x="112" y="2" width="108" height="68" rx="18" fill="#e8f5ec" stroke="#83c99b" stroke-width="2"/><path d="M 122 38 L 207 38" stroke="#2f7bbd" stroke-width="4" marker-end="url(#arrow)"/><path d="M 165 13 L 165 61" stroke="#cc4e9b" stroke-width="3"/><text x="157" y="21" class="sub" font-size="16">r</text><text x="196" y="31" class="sub" font-size="16">s</text></g></g><text x="500" y="860" class="main">body + terminal cap; never overlay matter</text><text x="500" y="895" class="sub">terminal cap has constant final s</text><rect x="42" y="964" width="1516" height="124" rx="18" fill="#ffffff" stroke="#c7d4df"/><rect x="42" y="964" width="244" height="124" rx="18" fill="#18324a"/><text x="68" y="1006" class="lane">7  ALPHA / EVENTS</text><g transform="translate(312 986) scale(0.72)"><g transform="translate(0 25) scale(0.22)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M 50 40 L 68 40" stroke="#e6a23c" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(70 20) scale(0.28)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M 128 40 L 146 40" stroke="#e6a23c" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(148 15) scale(0.34)"><path d="M 0 34 L 210 34" fill="none" stroke="#2f7bbd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="500" y="1002" class="main">SKELETON  →  PHYSICAL_CAP_BORN  →  CAP_STATION_FROZEN</text><text x="500" y="1037" class="sub">named event(s): CAP_BIRTH; exact height uses after-state</text>
