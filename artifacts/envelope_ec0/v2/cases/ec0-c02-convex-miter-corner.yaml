schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C02
slug: convex-miter-corner
title: Convex MITER corner
status: DEFINED
semantic_contracts:
  - id: C02-S1
    authority: USER_REQUIRED
    rule: MITER corner matter reaches the unique apex derived from the two incident strip supports.
  - id: C02-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: Coverage is the union of incident strips and one CornerEnvelope; internal ownership cannot alter the silhouette.
  - id: C02-S3
    authority: USER_REQUIRED
    rule: The corner model is selected at compile time and supplies one boundary to coverage, ownership, UV, and emission.
skeleton:
  nodes:
    - {id: start, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: turn, kind: CORNER, roles: [CONVEX, MITER]}
    - {id: end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
  edges:
    - {id: incoming, kind: SELECTED_SPINE, from: start, to: turn}
    - {id: outgoing, kind: SELECTED_SPINE, from: turn, to: end}
envelopes:
  - {id: strip_in, kind: StripEnvelope, source: incoming, alpha_law: TWO_SIDED_LINEAR}
  - {id: strip_out, kind: StripEnvelope, source: outgoing, alpha_law: TWO_SIDED_LINEAR}
  - {id: corner, kind: CornerEnvelope, source: turn, join: MITER, alpha_law: SUPPORT_INTERSECTION}
region_graph:
  regions:
    - {id: incoming_region, semantic_kind: STRIP, owner: strip_in, station_model: INCOMING_S}
    - {id: corner_region, semantic_kind: CORNER, owner: corner, station_model: CORNER_CONTINUATION}
    - {id: outgoing_region, semantic_kind: STRIP, owner: strip_out, station_model: OUTGOING_S}
  edges:
    - {regions: [incoming_region, corner_region], kind: CORNER_INTERFACE}
    - {regions: [corner_region, outgoing_region], kind: CORNER_INTERFACE}
boundary_lineage:
  - {boundary: inner_join, lineage: [strip_in, strip_out, turn, INNER], role: COVERAGE_SILHOUETTE}
  - {boundary: outer_miter_a, lineage: [corner, incoming, OUTER], role: COVERAGE_SILHOUETTE}
  - {boundary: outer_miter_b, lineage: [corner, outgoing, OUTER], role: COVERAGE_SILHOUETTE}
  - {boundary: apex, lineage: [corner, turn, MITER_APEX], role: SEMANTIC_ANCHOR}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: incoming_region, b: corner_region, through: P1_INTERFACE}
  - {a: corner_region, b: outgoing_region, through: P2_INTERFACE}
s_direction:
  authority: ROUTE_CONTINUATION_THROUGH_CORNER
  corner_rule: MONOTONE_FROM_INCOMING_TO_OUTGOING
  uv_mapping: {longitudinal: s, transverse: r}
alpha_evolution:
  - {stage: alpha_zero, coverage: POLYLINE_SKELETON, topology: NO_REGION}
  - {stage: alpha_positive, coverage: MITER_APEX_PRESENT, topology: THREE_SEMANTIC_REGIONS}
  - {stage: alpha_larger, coverage: SAME_JOIN_LAW_SCALED, topology: UNCHANGED_UNTIL_DECLARED_EVENT}
topology_events:
  - {id: birth, kind: BIRTH, height: ALPHA_ZERO, application: CLOSED_AT_AND_AFTER}
forbidden:
  - ROUND_FAN_SUBSTITUTION
  - POST_UNION_APEX_PATCH
  - OWNER_DIVIDER_IN_COVERAGE_SILHOUETTE
  - JOIN_SWITCH_DURING_RAW_DRAG
metamorphic_expectations:
  matrix_row: EC0-C02
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, corner_join_switch]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, join]
  exclude: [face_order, tessellation, sampled_arc, implementation_site_ids]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [incoming_use_left, incoming_use_right, outgoing_use_left, outgoing_use_right]}
physical_chains:
  - {id: incoming, kind: PHYSICAL_DECAL_SOURCE, source_lineage: incoming_semantic_line}
  - {id: outgoing, kind: PHYSICAL_DECAL_SOURCE, source_lineage: outgoing_semantic_line}
chain_uses:
  - {id: incoming_use, physical_chain: incoming, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: outgoing_use, physical_chain: outgoing, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_incoming_use, kind: FrontSeed, chain_use: incoming_use, owner_patch: owner_patch, sectors: [incoming_use_left, incoming_use_right]}
  - {id: front_seed_outgoing_use, kind: FrontSeed, chain_use: outgoing_use, owner_patch: owner_patch, sectors: [outgoing_use_left, outgoing_use_right]}
  - {id: corner_seed_miter, kind: CornerSeed, source_relation: CORNER_SEED_MITER, owner_patch: owner_patch, incident_chain_uses: [incoming_use, outgoing_use]}
front_components:
  - {id: fc_incoming_use_left, chain_use: incoming_use, owner_patch: owner_patch, sector: incoming_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_incoming_use_right, chain_use: incoming_use, owner_patch: owner_patch, sector: incoming_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_outgoing_use_left, chain_use: outgoing_use, owner_patch: owner_patch, sector: outgoing_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_outgoing_use_right, chain_use: outgoing_use, owner_patch: owner_patch, sector: outgoing_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [incoming_use, outgoing_use], seeds: [front_seed_incoming_use, front_seed_outgoing_use, corner_seed_miter], front_components: [fc_incoming_use_left, fc_incoming_use_right, fc_outgoing_use_left, fc_outgoing_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_incoming_use, kind: StripEnvelope, seed: front_seed_incoming_use, chain_use: incoming_use, front_components: [fc_incoming_use_left, fc_incoming_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_outgoing_use, kind: StripEnvelope, seed: front_seed_outgoing_use, chain_use: outgoing_use, front_components: [fc_outgoing_use_left, fc_outgoing_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_corner_seed_miter, kind: CornerEnvelope, seed: corner_seed_miter, chain_uses: [incoming_use, outgoing_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_incoming_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_incoming_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_outgoing_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_outgoing_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_incoming_use, strip_outgoing_use, contribution_corner_seed_miter], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions: []
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c02-convex-miter-corner.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c02-convex-miter-corner.png
