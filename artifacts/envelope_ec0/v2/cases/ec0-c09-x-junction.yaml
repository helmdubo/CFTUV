schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C09
slug: x-junction
title: Four-arm junction with declared route pairing
status: DEFINED
semantic_contracts:
  - id: C09-S1
    authority: USER_REQUIRED
    rule: A paired X-junction is one connected coverage union with a JunctionEnvelope core and four incident strip sectors.
  - id: C09-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: Route pairing is semantic input; edge order and smallest ids cannot infer it.
  - id: C09-S3
    authority: USER_REQUIRED
    rule: Missing or ambiguous pairing fails named as JUNCTION_ROUTE_PAIRING_REQUIRED.
skeleton:
  nodes:
    - {id: west, kind: PHYSICAL_ENDPOINT, roles: [ROUTE_A_START]}
    - {id: center, kind: JUNCTION, roles: [X, DEGREE_FOUR]}
    - {id: east, kind: PHYSICAL_ENDPOINT, roles: [ROUTE_A_END]}
    - {id: south, kind: PHYSICAL_ENDPOINT, roles: [ROUTE_B_START]}
    - {id: north, kind: PHYSICAL_ENDPOINT, roles: [ROUTE_B_END]}
  edges:
    - {id: west_arm, kind: SELECTED_SPINE, from: west, to: center, route: A}
    - {id: east_arm, kind: SELECTED_SPINE, from: center, to: east, route: A}
    - {id: south_arm, kind: SELECTED_SPINE, from: south, to: center, route: B}
    - {id: north_arm, kind: SELECTED_SPINE, from: center, to: north, route: B}
envelopes:
  - {id: west_strip, kind: StripEnvelope, source: west_arm, alpha_law: TWO_SIDED_LINEAR}
  - {id: east_strip, kind: StripEnvelope, source: east_arm, alpha_law: TWO_SIDED_LINEAR}
  - {id: south_strip, kind: StripEnvelope, source: south_arm, alpha_law: TWO_SIDED_LINEAR}
  - {id: north_strip, kind: StripEnvelope, source: north_arm, alpha_law: TWO_SIDED_LINEAR}
  - {id: junction_env, kind: JunctionEnvelope, source: center, alpha_law: FOUR_ARM_UNION}
region_graph:
  regions:
    - {id: route_a_west, semantic_kind: STRIP, owner: west_strip, station_model: ROUTE_A_S}
    - {id: route_a_core, semantic_kind: JUNCTION_SECTOR, owner: junction_env, station_model: ROUTE_A_S}
    - {id: route_a_east, semantic_kind: STRIP, owner: east_strip, station_model: ROUTE_A_S}
    - {id: route_b_south, semantic_kind: STRIP, owner: south_strip, station_model: ROUTE_B_S}
    - {id: route_b_core, semantic_kind: JUNCTION_SECTOR, owner: junction_env, station_model: ROUTE_B_S}
    - {id: route_b_north, semantic_kind: STRIP, owner: north_strip, station_model: ROUTE_B_S}
  edges:
    - {regions: [route_a_west, route_a_core], kind: STATION_CONTINUOUS}
    - {regions: [route_a_core, route_a_east], kind: STATION_CONTINUOUS}
    - {regions: [route_b_south, route_b_core], kind: STATION_CONTINUOUS}
    - {regions: [route_b_core, route_b_north], kind: STATION_CONTINUOUS}
    - {regions: [route_a_core, route_b_core], kind: UV_MODEL_DIVIDER}
boundary_lineage:
  - {boundary: outer_union, lineage: [west_strip, east_strip, south_strip, north_strip, junction_env], role: COVERAGE_SILHOUETTE}
  - {boundary: route_model_divider, lineage: [junction_env, route_pairing], role: UV_OWNERSHIP_DIVIDER}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: route_a_core, b: route_b_core, through: route_model_divider}
s_direction:
  authority: DECLARED_ROUTE_PAIRING
  route_a: WEST_TO_EAST_CONTINUOUS
  route_b: SOUTH_TO_NORTH_CONTINUOUS
alpha_evolution:
  - {stage: alpha_zero, coverage: X_SKELETON, topology: NO_REGION}
  - {stage: alpha_positive, coverage: CONNECTED_FOUR_ARM_UNION, topology: TWO_JUNCTION_STATION_SECTORS}
  - {stage: alpha_larger, coverage: SAME_COMBINATORICS_WIDER, topology: UNCHANGED_UNTIL_EXTERNAL_EVENT}
topology_events:
  - {id: junction_birth, kind: BIRTH, height: ALPHA_ZERO, application: ATOMIC}
  - {id: pairing_missing, kind: NAMED_FAILURE, height: COMPILE, failure: JUNCTION_ROUTE_PAIRING_REQUIRED}
forbidden:
  - FIRST_WINS_ROUTE_PAIRING
  - SMALLEST_ID_CORE_OWNER
  - OVERLAPPING_CROSSING_STRIPS
  - UNDECLARED_STATION_RESET
metamorphic_expectations:
  matrix_row: EC0-C09
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, route_pairing]
  exclude: [face_order, tessellation, arm_enumeration, numeric_ids]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [route_a_use_left, route_a_use_right, route_b_use_left, route_b_use_right]}
physical_chains:
  - {id: route_a, kind: PHYSICAL_DECAL_SOURCE, source_lineage: route_a_semantic_line}
  - {id: route_b, kind: PHYSICAL_DECAL_SOURCE, source_lineage: route_b_semantic_line}
chain_uses:
  - {id: route_a_use, physical_chain: route_a, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: route_b_use, physical_chain: route_b, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_route_a_use, kind: FrontSeed, chain_use: route_a_use, owner_patch: owner_patch, sectors: [route_a_use_left, route_a_use_right]}
  - {id: front_seed_route_b_use, kind: FrontSeed, chain_use: route_b_use, owner_patch: owner_patch, sectors: [route_b_use_left, route_b_use_right]}
  - {id: junction_seed_x, kind: JunctionSeed, source_relation: JUNCTION_SEED_X, owner_patch: owner_patch, incident_chain_uses: [route_a_use, route_b_use]}
front_components:
  - {id: fc_route_a_use_left, chain_use: route_a_use, owner_patch: owner_patch, sector: route_a_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_route_a_use_right, chain_use: route_a_use, owner_patch: owner_patch, sector: route_a_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_route_b_use_left, chain_use: route_b_use, owner_patch: owner_patch, sector: route_b_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_route_b_use_right, chain_use: route_b_use, owner_patch: owner_patch, sector: route_b_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [route_a_use, route_b_use], seeds: [front_seed_route_a_use, front_seed_route_b_use, junction_seed_x], front_components: [fc_route_a_use_left, fc_route_a_use_right, fc_route_b_use_left, fc_route_b_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_route_a_use, kind: StripEnvelope, seed: front_seed_route_a_use, chain_use: route_a_use, front_components: [fc_route_a_use_left, fc_route_a_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_route_b_use, kind: StripEnvelope, seed: front_seed_route_b_use, chain_use: route_b_use, front_components: [fc_route_b_use_left, fc_route_b_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_junction_seed_x, kind: JunctionEnvelope, seed: junction_seed_x, chain_uses: [route_a_use, route_b_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_route_a_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_route_a_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_route_b_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_route_b_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_route_a_use, strip_route_b_use, contribution_junction_seed_x], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions:
  - {id: junction_assembly, kind: COMPILE_STATIC_JUNCTION_UNION, participants: [strip_route_a_use, strip_route_b_use, contribution_junction_seed_x], gate: JUNCTION_SEED_PRESENT, coverage_effect: ADD_DECLARED_JUNCTION_CONTRIBUTION, owner_patch: owner_patch}
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c09-x-junction.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c09-x-junction.png
