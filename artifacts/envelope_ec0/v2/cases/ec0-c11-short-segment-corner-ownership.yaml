schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C11
slug: short-segment-corner-ownership
title: Two corner owners on a short segment
status: DEFINED
semantic_contracts:
  - id: C11-S1
    authority: FIELD_PROVEN
    rule: Endpoint corner claims are clipped by a physical-segment divider before they are removed from strip coverage.
  - id: C11-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: In the symmetric homogeneous case the divider is the physical midpoint cross-section; it is not chosen by corner or chain id.
  - id: C11-S3
    authority: MATHEMATICALLY_REQUIRED
    rule: When corner claims meet, the body may collapse at a declared event but total coverage remains single and ownership remains disjoint.
skeleton:
  nodes:
    - {id: corner_a, kind: CORNER, roles: [ENDPOINT_OWNER_A]}
    - {id: corner_b, kind: CORNER, roles: [ENDPOINT_OWNER_B]}
  edges:
    - {id: short_segment, kind: SELECTED_SPINE, from: corner_a, to: corner_b}
envelopes:
  - {id: strip, kind: StripEnvelope, source: short_segment, alpha_law: TWO_SIDED_LINEAR}
  - {id: corner_env_a, kind: CornerEnvelope, source: corner_a, alpha_law: ENDPOINT_CLAIM}
  - {id: corner_env_b, kind: CornerEnvelope, source: corner_b, alpha_law: ENDPOINT_CLAIM}
region_graph:
  regions:
    - {id: owner_a_region, semantic_kind: CORNER_CLAIM, owner: corner_env_a, station_model: FROM_A}
    - {id: body_region, semantic_kind: STRIP, owner: strip, station_model: SEGMENT_S}
    - {id: owner_b_region, semantic_kind: CORNER_CLAIM, owner: corner_env_b, station_model: FROM_B}
  edges:
    - {regions: [owner_a_region, body_region], kind: CORNER_OWNER_INTERFACE}
    - {regions: [body_region, owner_b_region], kind: CORNER_OWNER_INTERFACE}
    - {regions: [owner_a_region, owner_b_region], kind: ACTIVE_AFTER_BODY_COLLAPSE}
boundary_lineage:
  - {boundary: outer_union, lineage: [strip, corner_env_a, corner_env_b], role: COVERAGE_SILHOUETTE}
  - {boundary: owner_divider, lineage: [short_segment, PHYSICAL_BISECTOR], role: OWNERSHIP_DIVIDER}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: owner_a_region, b: owner_b_region, through: owner_divider, active: AFTER_BODY_COLLAPSE}
s_direction:
  authority: CORNER_A_TO_CORNER_B
  divider_station: PHYSICAL_MIDPOINT_IN_SYMMETRIC_CASE
  owner_b_reading: REVERSED_FROM_CORNER_B
alpha_evolution:
  - {stage: before_claim_meeting, coverage: CORNERS_SEPARATED_BY_BODY, topology: THREE_REGIONS}
  - {stage: at_claim_meeting, coverage: BODY_ZERO_MEASURE_AT_DIVIDER, topology: COLLAPSE_EVENT}
  - {stage: after_claim_meeting, coverage: SAME_COMPONENT_SINGLE_COVER, topology: TWO_OWNER_REGIONS}
topology_events:
  - {id: body_collapse, kind: COLLAPSE, height: ALPHA_CLAIM_MEET, application: CLOSED_AT_AND_AFTER}
forbidden:
  - FIRST_CORNER_WINS
  - SMALLEST_ID_OWNS_TIE
  - OVERLAPPING_CORNER_CROPS
  - CORNER_DIVIDER_CHANGES_COVERAGE_SILHOUETTE
metamorphic_expectations:
  matrix_row: EC0-C11
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, corner_join_switch]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors]
  exclude: [face_order, tessellation, endpoint_indices, first_wins_order]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [short_route_use_left, short_route_use_right]}
physical_chains:
  - {id: short_route, kind: PHYSICAL_DECAL_SOURCE, source_lineage: short_route_semantic_line}
chain_uses:
  - {id: short_route_use, physical_chain: short_route, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_short_route_use, kind: FrontSeed, chain_use: short_route_use, owner_patch: owner_patch, sectors: [short_route_use_left, short_route_use_right]}
  - {id: corner_seed_start, kind: CornerSeed, source_relation: CORNER_SEED_START, owner_patch: owner_patch, incident_chain_uses: [short_route_use]}
  - {id: corner_seed_end, kind: CornerSeed, source_relation: CORNER_SEED_END, owner_patch: owner_patch, incident_chain_uses: [short_route_use]}
front_components:
  - {id: fc_short_route_use_left, chain_use: short_route_use, owner_patch: owner_patch, sector: short_route_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_short_route_use_right, chain_use: short_route_use, owner_patch: owner_patch, sector: short_route_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [short_route_use], seeds: [front_seed_short_route_use, corner_seed_start, corner_seed_end], front_components: [fc_short_route_use_left, fc_short_route_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_short_route_use, kind: StripEnvelope, seed: front_seed_short_route_use, chain_use: short_route_use, front_components: [fc_short_route_use_left, fc_short_route_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_corner_seed_start, kind: CornerEnvelope, seed: corner_seed_start, chain_uses: [short_route_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_corner_seed_end, kind: CornerEnvelope, seed: corner_seed_end, chain_uses: [short_route_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_short_route_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_short_route_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_short_route_use, contribution_corner_seed_start, contribution_corner_seed_end], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions:
  - {id: ownership_claim_meeting, kind: EXACT_CLAIM_EQUALITY, participants: [strip_short_route_use, contribution_corner_seed_start, contribution_corner_seed_end], gate: EQUALITY_EVENT, coverage_effect: NONE, ownership_effect: OWNERLESS_DIVIDER, owner_patch: owner_patch}
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c11-short-segment-corner-ownership.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c11-short-segment-corner-ownership.png
