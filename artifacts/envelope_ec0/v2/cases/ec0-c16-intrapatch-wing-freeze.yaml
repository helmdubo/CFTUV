schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C16
slug: intrapatch-wing-freeze
title: Same-decal pChain wing collision and self-collision
status: DEFINED
selected_alternative: B_COVERAGE_CLIP
scope:
  decal_identity: SAME_DECAL_REQUIRED
  owner_patch: SINGLE_PATCH_REQUIRED
  participants: PCHAIN_WING_FRONTS
  allowed_encounters:
    - DIFFERENT_PCHAIN_WINGS
    - SAME_WING_SELF_COLLISION
  cross_decal_interaction: FORBIDDEN
semantic_contracts:
  - id: C16-S1
    authority: USER_REQUIRED
    rule: Every colliding wing belongs to one decal and one owner Patch; different decals never enter this interaction system.
  - id: C16-S2
    authority: USER_REQUIRED
    rule: Participants are offset wings emitted from pChains, including two wings from different pChains and self-collision of one wing.
  - id: C16-S3
    authority: FIELD_PROVEN
    rule: Interaction has no effect before mutual arrival; an unarrived wing cannot clip or round current decal matter.
  - id: C16-S4
    authority: FIELD_PROVEN
    rule: After a meeting, the freeze locus remains stable under further alpha drag unless another declared event occurs.
  - id: C16-S5
    authority: USER_REQUIRED
    rule: Selected policy B clips the participating wing coverages at the mutual equality locus; it does not merely partition UV ownership and does not create new matter.
  - id: C16-S6
    authority: USER_REQUIRED
    rule: Freeze resolves boundary-limited FrontComponent contributions at their effective alpha; capacity of one component does not stop unrelated components.
skeleton:
  patch:
    id: owner_patch
    role: OFFSET_DOMAIN
  decal:
    id: same_decal
    owner_patch: owner_patch
  nodes:
    - {id: pchain_a_origin, kind: PCHAIN_SOURCE, roles: [WING_A_ORIGIN]}
    - {id: wing_a_front, kind: WING_FRONT, roles: [A_FORWARD]}
    - {id: wing_b_front, kind: WING_FRONT, roles: [B_FORWARD]}
    - {id: pchain_b_origin, kind: PCHAIN_SOURCE, roles: [WING_B_ORIGIN]}
  edges:
    - {id: wing_a, kind: OFFSET_WING, from: pchain_a_origin, to: wing_a_front, decal: same_decal, patch: owner_patch}
    - {id: wing_b, kind: OFFSET_WING, from: pchain_b_origin, to: wing_b_front, decal: same_decal, patch: owner_patch}
  self_collision_projection:
    wing_identity: wing_self
    fronts: [self_front_a, self_front_b]
    decal: same_decal
    patch: owner_patch
envelopes:
  - {id: wing_coverage_a, kind: StripEnvelope, source: wing_a, alpha_law: OFFSET_GROWTH}
  - {id: wing_coverage_b, kind: StripEnvelope, source: wing_b, alpha_law: OFFSET_GROWTH}
boundary_resolution:
  policy: BOUNDARY_LIMITED_PROPAGATION
  ordering: BEFORE_INTRA_PATCH_FRONT_INTERACTION
  component_capacity_scope: LOCAL_FRONT_COMPONENT
region_graph:
  regions:
    - {id: resolved_wing_a, semantic_kind: RESOLVED_WING_COVERAGE, decal_owner: same_decal, patch_owner: owner_patch, station_claim: WING_A_S}
    - {id: resolved_wing_b, semantic_kind: RESOLVED_WING_COVERAGE, decal_owner: same_decal, patch_owner: owner_patch, station_claim: WING_B_S}
  edges:
    - {regions: [resolved_wing_a, resolved_wing_b], kind: FREEZE_ADJACENCY, through: mutual_equality_locus}
  resolved_coverage: WINGS_CLIPPED_AT_MUTUAL_EQUALITY_LOCUS
  self_collision_rule: TWO_FRONTS_OF_ONE_WING_USE_THE_SAME_CLIP_SEMANTICS
boundary_lineage:
  - {boundary: primitive_front_a, lineage: [wing_coverage_a, alpha], role: PRE_INTERACTION_COVERAGE}
  - {boundary: primitive_front_b, lineage: [wing_coverage_b, alpha], role: PRE_INTERACTION_COVERAGE}
  - {boundary: mutual_equality_locus, lineage: [wing_coverage_a, wing_coverage_b, MUTUAL_ARRIVAL], role: RESOLVED_COVERAGE_AND_STATION_DIVIDER}
owners:
  decal_owner: same_decal
  patch_owner: owner_patch
  station_claims_total: true
  station_claims_disjoint: true
  tie_boundary_owner: NONE
  self_collision_owner_change: NONE
adjacency:
  - {a: resolved_wing_a, b: resolved_wing_b, through: mutual_equality_locus, active: AFTER_MUTUAL_ARRIVAL}
s_direction:
  authority: PCHAIN_WING_LOCAL_STATIONS
  wing_a: INCREASES_TOWARD_MEETING
  wing_b: INCREASES_TOWARD_MEETING
  self_collision: PRESERVES_BOTH_FRONT_READINGS_OF_THE_SAME_WING
  equality_locus: PRESERVES_BOTH_READINGS_WITHOUT_ID_TIE_BREAK
alpha_evolution:
  - {stage: before_mutual_arrival, coverage: WINGS_GROW_INDEPENDENTLY_INSIDE_OWNER_PATCH, topology: NO_INTERACTION}
  - {stage: at_mutual_arrival, coverage: FIRST_WING_CONTACT, topology: FREEZE_EVENT}
  - {stage: after_mutual_arrival, coverage: WINGS_CLIPPED_AT_STABLE_LOCUS, topology: DEFINED_POLICY_B}
topology_events:
  - {id: mutual_arrival, kind: FREEZE, height: ALPHA_MEET, application: CLOSED_AT_AND_AFTER}
rejected_alternatives:
  A:
    label: OWNERSHIP_ONLY
    status: REJECTED_BY_USER
    reason: Collision must stop and clip existing decal wings rather than preserve the full primitive union as an ownership-only overlap.
  C:
    label: NEW_MATTER_OPERATOR
    status: REJECTED_BY_USER
    reason: Collision does not create a third decal region with an independent owner or UV model.
forbidden:
  - CROSS_DECAL_COLLISION_PARTICIPANT
  - CROSS_PATCH_WING_INTERACTION
  - EFFECT_BEFORE_MUTUAL_ARRIVAL
  - FIRST_WINS_OR_SMALLEST_ID_STATION_CLAIM
  - OWNERSHIP_ONLY_OVERLAP_AFTER_FREEZE
  - NEW_INTERACTION_MATTER
  - RASTER_OR_TOLERANCE_SELECTS_FREEZE
  - OVERLAPPING_FINAL_WING_FACES
metamorphic_expectations:
  matrix_row: EC0-C16
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, intrapatch_wing_policy_switch]
canonical_digest_projection:
  include: [selected_alternative, decal_identity, owner_patch, encounter_kind, region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, interaction_state]
  exclude: [face_order, tessellation, pchain_enumeration, smallest_id_tie_break, roadmap_component_term]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [pchain_a_use_left, pchain_a_use_right, pchain_b_use_left, pchain_b_use_right]}
physical_chains:
  - {id: pchain_a, kind: PHYSICAL_DECAL_SOURCE, source_lineage: pchain_a_semantic_line}
  - {id: pchain_b, kind: PHYSICAL_DECAL_SOURCE, source_lineage: pchain_b_semantic_line}
chain_uses:
  - {id: pchain_a_use, physical_chain: pchain_a, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: pchain_b_use, physical_chain: pchain_b, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_pchain_a_use, kind: FrontSeed, chain_use: pchain_a_use, owner_patch: owner_patch, sectors: [pchain_a_use_left, pchain_a_use_right]}
  - {id: front_seed_pchain_b_use, kind: FrontSeed, chain_use: pchain_b_use, owner_patch: owner_patch, sectors: [pchain_b_use_left, pchain_b_use_right]}
front_components:
  - {id: fc_pchain_a_use_left, chain_use: pchain_a_use, owner_patch: owner_patch, sector: pchain_a_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_pchain_a_use_right, chain_use: pchain_a_use, owner_patch: owner_patch, sector: pchain_a_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_pchain_b_use_left, chain_use: pchain_b_use, owner_patch: owner_patch, sector: pchain_b_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_pchain_b_use_right, chain_use: pchain_b_use, owner_patch: owner_patch, sector: pchain_b_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [pchain_a_use, pchain_b_use], seeds: [front_seed_pchain_a_use, front_seed_pchain_b_use], front_components: [fc_pchain_a_use_left, fc_pchain_a_use_right, fc_pchain_b_use_left, fc_pchain_b_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_pchain_a_use, kind: StripEnvelope, seed: front_seed_pchain_a_use, chain_use: pchain_a_use, front_components: [fc_pchain_a_use_left, fc_pchain_a_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_pchain_b_use, kind: StripEnvelope, seed: front_seed_pchain_b_use, chain_use: pchain_b_use, front_components: [fc_pchain_b_use_left, fc_pchain_b_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_pchain_a_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_pchain_a_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_pchain_b_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_pchain_b_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_pchain_a_use, strip_pchain_b_use], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions:
  - {id: interaction_main, kind: INTRAPATCH_B_COVERAGE_CLIP, participants: [fc_pchain_a_use_left, fc_pchain_a_use_right, fc_pchain_b_use_left, fc_pchain_b_use_right], gate: MUTUAL_ARRIVAL_OR_DECLARED_EVENT, coverage_effect: CLIP_EXISTING_CONTRIBUTIONS, owner_patch: owner_patch}
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c16-intrapatch-wing-freeze.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c16-intrapatch-wing-freeze.png
