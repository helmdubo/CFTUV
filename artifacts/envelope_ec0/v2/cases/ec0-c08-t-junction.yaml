schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C08
slug: t-junction
title: Three-arm T-junction
status: DEFINED
semantic_contracts:
  - id: C08-S1
    authority: USER_REQUIRED
    rule: T-junction coverage is one connected union of the three incident strips and one JunctionEnvelope with no hole or overlap.
  - id: C08-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: The central junction owns its semantic matter; route enumeration cannot assign the core by first-wins.
  - id: C08-S3
    authority: USER_REQUIRED
    rule: The trunk keeps continuous s through the junction while branch s has its semantic origin at the junction.
skeleton:
  nodes:
    - {id: trunk_start, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: junction, kind: JUNCTION, roles: [T, DEGREE_THREE]}
    - {id: trunk_end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
    - {id: branch_end, kind: PHYSICAL_ENDPOINT, roles: [BRANCH_END]}
  edges:
    - {id: trunk_in, kind: SELECTED_SPINE, from: trunk_start, to: junction, route: trunk}
    - {id: trunk_out, kind: SELECTED_SPINE, from: junction, to: trunk_end, route: trunk}
    - {id: branch, kind: SELECTED_SPINE, from: junction, to: branch_end, route: branch}
envelopes:
  - {id: strip_trunk_in, kind: StripEnvelope, source: trunk_in, alpha_law: TWO_SIDED_LINEAR}
  - {id: strip_trunk_out, kind: StripEnvelope, source: trunk_out, alpha_law: TWO_SIDED_LINEAR}
  - {id: strip_branch, kind: StripEnvelope, source: branch, alpha_law: TWO_SIDED_LINEAR}
  - {id: junction_env, kind: JunctionEnvelope, source: junction, alpha_law: THREE_ARM_UNION}
region_graph:
  regions:
    - {id: trunk_in_region, semantic_kind: STRIP, owner: strip_trunk_in, station_model: TRUNK_S}
    - {id: junction_trunk_sector, semantic_kind: JUNCTION_SECTOR, owner: junction_env, station_model: TRUNK_S}
    - {id: junction_branch_sector, semantic_kind: JUNCTION_SECTOR, owner: junction_env, station_model: BRANCH_S}
    - {id: trunk_out_region, semantic_kind: STRIP, owner: strip_trunk_out, station_model: TRUNK_S}
    - {id: branch_region, semantic_kind: STRIP, owner: strip_branch, station_model: BRANCH_S}
  edges:
    - {regions: [trunk_in_region, junction_trunk_sector], kind: STATION_CONTINUOUS}
    - {regions: [junction_trunk_sector, trunk_out_region], kind: STATION_CONTINUOUS}
    - {regions: [junction_branch_sector, branch_region], kind: STATION_CONTINUOUS}
    - {regions: [junction_trunk_sector, junction_branch_sector], kind: UV_MODEL_DIVIDER}
boundary_lineage:
  - {boundary: outer_union, lineage: [strip_trunk_in, strip_trunk_out, strip_branch, junction_env], role: COVERAGE_SILHOUETTE}
  - {boundary: internal_station_divider, lineage: [junction_env, trunk, branch], role: UV_OWNERSHIP_DIVIDER}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: junction_trunk_sector, b: junction_branch_sector, through: internal_station_divider}
s_direction:
  authority: DECLARED_ROUTE_IDENTITIES
  trunk: CONTINUOUS_THROUGH_JUNCTION
  branch: ZERO_AT_JUNCTION_AND_INCREASES_OUTWARD
alpha_evolution:
  - {stage: alpha_zero, coverage: T_SKELETON, topology: NO_REGION}
  - {stage: alpha_positive, coverage: CONNECTED_THREE_ARM_UNION, topology: JUNCTION_SECTORS_PRESENT}
  - {stage: alpha_larger, coverage: SAME_COMBINATORICS_WIDER, topology: UNCHANGED_UNTIL_EXTERNAL_EVENT}
topology_events:
  - {id: junction_birth, kind: BIRTH, height: ALPHA_ZERO, application: ATOMIC}
forbidden:
  - HOLE_AT_JUNCTION_CORE
  - OVERLAPPING_ARM_FACES
  - FIRST_WINS_JUNCTION_OWNER
  - BRANCH_S_RESETS_TRUNK_S
metamorphic_expectations:
  matrix_row: EC0-C08
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, route_pairing]
  exclude: [face_order, tessellation, arm_enumeration, first_wins_owner]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [trunk_use_left, trunk_use_right, branch_use_left, branch_use_right]}
physical_chains:
  - {id: trunk, kind: PHYSICAL_DECAL_SOURCE, source_lineage: trunk_semantic_line}
  - {id: branch, kind: PHYSICAL_DECAL_SOURCE, source_lineage: branch_semantic_line}
chain_uses:
  - {id: trunk_use, physical_chain: trunk, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: branch_use, physical_chain: branch, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_trunk_use, kind: FrontSeed, chain_use: trunk_use, owner_patch: owner_patch, sectors: [trunk_use_left, trunk_use_right]}
  - {id: front_seed_branch_use, kind: FrontSeed, chain_use: branch_use, owner_patch: owner_patch, sectors: [branch_use_left, branch_use_right]}
  - {id: junction_seed_t, kind: JunctionSeed, source_relation: JUNCTION_SEED_T, owner_patch: owner_patch, incident_chain_uses: [trunk_use, branch_use]}
front_components:
  - {id: fc_trunk_use_left, chain_use: trunk_use, owner_patch: owner_patch, sector: trunk_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_trunk_use_right, chain_use: trunk_use, owner_patch: owner_patch, sector: trunk_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_branch_use_left, chain_use: branch_use, owner_patch: owner_patch, sector: branch_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_branch_use_right, chain_use: branch_use, owner_patch: owner_patch, sector: branch_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [trunk_use, branch_use], seeds: [front_seed_trunk_use, front_seed_branch_use, junction_seed_t], front_components: [fc_trunk_use_left, fc_trunk_use_right, fc_branch_use_left, fc_branch_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_trunk_use, kind: StripEnvelope, seed: front_seed_trunk_use, chain_use: trunk_use, front_components: [fc_trunk_use_left, fc_trunk_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_branch_use, kind: StripEnvelope, seed: front_seed_branch_use, chain_use: branch_use, front_components: [fc_branch_use_left, fc_branch_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_junction_seed_t, kind: JunctionEnvelope, seed: junction_seed_t, chain_uses: [trunk_use, branch_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_trunk_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_trunk_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_branch_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_branch_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: REQUESTED_ALPHA, capacity_reason: NONE, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_trunk_use, strip_branch_use, contribution_junction_seed_t], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions:
  - {id: junction_assembly, kind: COMPILE_STATIC_JUNCTION_UNION, participants: [strip_trunk_use, strip_branch_use, contribution_junction_seed_t], gate: JUNCTION_SEED_PRESENT, coverage_effect: ADD_DECLARED_JUNCTION_CONTRIBUTION, owner_patch: owner_patch}
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c08-t-junction.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c08-t-junction.png
