schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C14
slug: proven-saturation
title: Proven capacity saturation
status: DEFINED
pivot_policy:
  propagation: BOUNDARY_LIMITED_PROPAGATION
  capacity_scope: FRONT_COMPONENT
semantic_contracts:
  - id: C14-S1
    authority: FIELD_PROVEN
    rule: SATURATE_PROVEN clamps coverage at the last constructible physical station and records a saturation event.
  - id: C14-S2
    authority: USER_REQUIRED
    rule: Increasing alpha after saturation creates no new matter and does not move the terminal boundary.
  - id: C14-S3
    authority: MATHEMATICALLY_REQUIRED
    rule: Saturation is valid only when the plan proves a unique maximal single-cover result; otherwise the outcome is a named failure or controlled recompile.
  - id: C14-S4
    authority: USER_REQUIRED
    rule: BARRIER_SPLIT_REQUIRED preserves requested alpha, clamps only the affected FrontComponent to effective alpha, and does not stop other components.
skeleton:
  nodes:
    - {id: source, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: route_end, kind: PHYSICAL_ENDPOINT, roles: [PHYSICAL_CAPACITY_END]}
  edges:
    - {id: route, kind: SELECTED_SPINE, from: source, to: route_end}
envelopes:
  - {id: strip, kind: StripEnvelope, source: route, alpha_law: CLAMP_AT_PROVEN_CAPACITY}
  - {id: terminal_cap, kind: CapEnvelope, source: route_end, alpha_law: FROZEN_AFTER_SATURATION}
region_graph:
  regions:
    - {id: body, semantic_kind: STRIP, owner: strip, station_model: ROUTE_S}
    - {id: terminal_region, semantic_kind: CAP, owner: terminal_cap, station_model: LAST_CONSTRUCTIBLE_S}
  edges:
    - {regions: [body, terminal_region], kind: SATURATED_END_INTERFACE}
boundary_lineage:
  - {boundary: free_sides, lineage: [strip, route], role: COVERAGE_SILHOUETTE}
  - {boundary: saturated_end, lineage: [terminal_cap, route_end, LAST_CONSTRUCTIBLE_STATION], role: FROZEN_COVERAGE_SILHOUETTE}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: body, b: terminal_region, through: saturated_end}
s_direction:
  authority: SOURCE_TO_ROUTE_END
  after_saturation: CLAMP_TO_LAST_CONSTRUCTIBLE_STATION
  revisit_effect: NO_SECOND_TRAVERSAL
alpha_evolution:
  - {stage: below_capacity, coverage: GROWS_WITH_ALPHA, topology: UNSATURATED}
  - {stage: at_capacity, coverage: MAXIMAL_PROVEN_SINGLE_COVER, topology: SATURATION_EVENT}
  - {stage: beyond_capacity, coverage: IDENTICAL_TO_AT_CAPACITY, topology: FROZEN}
capacity_state:
  requested_alpha: MAY_EXCEED_EFFECTIVE_ALPHA
  effective_alpha: LAST_PROVEN_UNAMBIGUOUS_STATE
  capacity_reason: [PHYSICAL_ROUTE_EXHAUSTED, BARRIER_SPLIT_REQUIRED]
  capability_outcome: BARRIER_BYPASS_UNSUPPORTED_WHEN_SPLIT_REQUIRED
  user_status: BOUNDARY_CAPACITY_REACHED
  scope: AFFECTED_FRONT_COMPONENT_ONLY
topology_events:
  - {id: saturation, kind: SATURATION, height: ALPHA_CAPACITY, application: CLOSED_AT_AND_AFTER}
forbidden:
  - UNIVERSAL_CLAMP_WITHOUT_CAPACITY_PROOF
  - SECOND_PASS_AROUND_CLOSED_ROUTE
  - PREVIEW_CONFIRM_CAPACITY_DIVERGENCE
  - SILENT_FALLBACK_ON_UNPROVEN_CAPACITY
  - GLOBAL_PATCH_CLAMP_FROM_ONE_COMPONENT
  - OBSTACLE_BYPASS_BRANCH_CREATION_IN_V1
metamorphic_expectations:
  matrix_row: EC0-C14
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, capacity_policy_switch]
canonical_digest_projection:
  include: [pivot_policy, capacity_state, region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, capacity_policy]
  exclude: [face_order, tessellation, repeated_route_edges, last_valid_ui_state]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [route_use_left, route_use_right, companion_use_left, companion_use_right]}
physical_chains:
  - {id: route, kind: PHYSICAL_DECAL_SOURCE, source_lineage: route_semantic_line}
  - {id: companion, kind: PHYSICAL_DECAL_SOURCE, source_lineage: companion_semantic_line}
chain_uses:
  - {id: route_use, physical_chain: route, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: companion_use, physical_chain: companion, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_route_use, kind: FrontSeed, chain_use: route_use, owner_patch: owner_patch, sectors: [route_use_left, route_use_right]}
  - {id: front_seed_companion_use, kind: FrontSeed, chain_use: companion_use, owner_patch: owner_patch, sectors: [companion_use_left, companion_use_right]}
front_components:
  - {id: fc_route_use_left, chain_use: route_use, owner_patch: owner_patch, sector: route_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_route_use_right, chain_use: route_use, owner_patch: owner_patch, sector: route_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_companion_use_left, chain_use: companion_use, owner_patch: owner_patch, sector: companion_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_companion_use_right, chain_use: companion_use, owner_patch: owner_patch, sector: companion_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [route_use, companion_use], seeds: [front_seed_route_use, front_seed_companion_use], front_components: [fc_route_use_left, fc_route_use_right, fc_companion_use_left, fc_companion_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_route_use, kind: StripEnvelope, seed: front_seed_route_use, chain_use: route_use, front_components: [fc_route_use_left, fc_route_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_companion_use, kind: StripEnvelope, seed: front_seed_companion_use, chain_use: companion_use, front_components: [fc_companion_use_left, fc_companion_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events:
  - {id: event_1_saturation, kind: SATURATION, exact_height_key: ALPHA_SATURATION, boundary_provenance: [domain_main, OUTER_BOUNDARY], atomic_batch: CASE_DECLARED_BATCH_OR_PARTIAL_ORDER, active_interval_transition: COMPILE_DECLARED_AFTER_STATE}
  - {id: event_2_barrier_split_required, kind: BARRIER_SPLIT_REQUIRED, exact_height_key: ALPHA_BARRIER_SPLIT_REQUIRED, boundary_provenance: [domain_main, OUTER_BOUNDARY], atomic_batch: CASE_DECLARED_BATCH_OR_PARTIAL_ORDER, active_interval_transition: COMPILE_DECLARED_AFTER_STATE}
capacity_states:
  - {front_component: fc_route_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_route_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_companion_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_companion_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_route_use, strip_companion_use], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions: []
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c14-proven-saturation.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c14-proven-saturation.png
