schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C13
slug: bevel-foreign-collision
title: Another wing of the same decal collides with a BEVEL corner
status: DEFINED
scope:
  decal_identity: SAME_DECAL_REQUIRED
  owner_patch: SINGLE_PATCH_REQUIRED
  participants: PCHAIN_WING_FRONTS
  cross_decal_interaction: FORBIDDEN
semantic_contracts:
  - id: C13-S1
    authority: FIELD_PROVEN
    rule: Another arrived wing of the same decal and Patch may fill the wedge released by BEVEL and must stop on the actual P1-P2 chord.
  - id: C13-S2
    authority: FIELD_PROVEN
    rule: The other-wing interaction is gated by mutual arrival; an unarrived wing cannot round or cut the silhouette.
  - id: C13-S3
    authority: USER_REQUIRED
    rule: Own incident strip coverage is identical to MITER; the BEVEL triangle remains owned by its CornerEnvelope.
  - id: C13-S4
    authority: USER_REQUIRED
    rule: Collision participants always belong to one decal and one owner Patch; different decals and different Patches never interact.
skeleton:
  patch:
    id: owner_patch
    role: OFFSET_DOMAIN
  decal:
    id: same_decal
    owner_patch: owner_patch
  nodes:
    - {id: own_start, kind: PHYSICAL_ENDPOINT, roles: [OWN_SEMANTIC_START]}
    - {id: turn, kind: CORNER, roles: [CONVEX, BEVEL]}
    - {id: own_end, kind: PHYSICAL_ENDPOINT, roles: [OWN_SEMANTIC_END]}
    - {id: other_wing_start, kind: PHYSICAL_ENDPOINT, roles: [OTHER_PCHAIN_WING_SOURCE]}
    - {id: other_wing_end, kind: PHYSICAL_ENDPOINT, roles: [OTHER_PCHAIN_WING_END]}
  edges:
    - {id: own_in, kind: SELECTED_SPINE, from: own_start, to: turn}
    - {id: own_out, kind: SELECTED_SPINE, from: turn, to: own_end}
    - {id: other_wing, kind: SELECTED_SPINE, from: other_wing_start, to: other_wing_end, decal: same_decal, patch: owner_patch}
envelopes:
  - {id: own_strip_in, kind: StripEnvelope, source: own_in, alpha_law: TWO_SIDED_LINEAR}
  - {id: own_strip_out, kind: StripEnvelope, source: own_out, alpha_law: TWO_SIDED_LINEAR}
  - {id: bevel_corner, kind: CornerEnvelope, source: turn, join: BEVEL, semantic_anchors: [V, P1, P2], alpha_law: CHORD_CLOSURE}
  - {id: other_wing_strip, kind: StripEnvelope, source: other_wing, alpha_law: TWO_SIDED_LINEAR}
region_graph:
  regions:
    - {id: own_region, semantic_kind: STRIP, owner: OWN_STRIPS, station_model: OWN_S}
    - {id: bevel_region, semantic_kind: CORNER, owner: bevel_corner, station_model: OWN_CORNER_S}
    - {id: other_wing_region, semantic_kind: STRIP, owner: other_wing_strip, station_model: OTHER_WING_S}
  edges:
    - {regions: [own_region, bevel_region], kind: CORNER_INTERFACE}
    - {regions: [bevel_region, other_wing_region], kind: COLLISION_ON_BEVEL_CHORD, active: AFTER_MUTUAL_ARRIVAL}
boundary_lineage:
  - {boundary: bevel_chord, lineage: [bevel_corner, P1, P2], role: COVERAGE_AND_COLLISION_BOUNDARY}
  - {boundary: other_wing_front_before_meet, lineage: [other_wing_strip, alpha], role: COVERAGE_SILHOUETTE}
  - {boundary: contact_after_meet, lineage: [other_wing_strip, bevel_corner, bevel_chord], role: OWNERSHIP_ADJACENCY}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
adjacency:
  - {a: bevel_region, b: other_wing_region, through: contact_after_meet}
s_direction:
  authority: OWNER_LOCAL_STATION_MODELS
  collision_effect: NONE_ON_BEVEL_S_AND_OTHER_WING_S
  chord_stations: RETAIN_P1_P2_PROVENANCE
alpha_evolution:
  - {stage: before_mutual_arrival, coverage: OTHER_WING_FRONT_FREE_AND_BEVEL_UNCUT, topology: NO_COLLISION_ADJACENCY}
  - {stage: at_mutual_arrival, coverage: FIRST_CONTACT_ON_CHORD, topology: CONTACT_BIRTH}
  - {stage: after_mutual_arrival, coverage: OTHER_WING_REACHES_CHORD, topology: DISJOINT_STATION_CLAIMS}
topology_events:
  - {id: mutual_arrival, kind: FREEZE, height: ALPHA_MEET, application: CLOSED_AT_AND_AFTER}
forbidden:
  - OTHER_WING_FRONT_ORBITS_MISSING_MITER_APEX
  - FAN_OR_ARC_BITE_AT_BEVEL
  - COLLISION_BEFORE_MUTUAL_ARRIVAL
  - BEVEL_CHANGES_OWN_STRIP_COVERAGE
  - CROSS_DECAL_COLLISION_PARTICIPANT
  - CROSS_PATCH_WING_INTERACTION
metamorphic_expectations:
  matrix_row: EC0-C13
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap, corner_join_switch]
canonical_digest_projection:
  include: [region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, interaction_state, join]
  exclude: [face_order, tessellation, missing_miter_apex, sampled_fan]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_BOUNDARY], sectors: [bevel_in_use_left, bevel_in_use_right, bevel_out_use_left, bevel_out_use_right, other_wing_use_left, other_wing_use_right]}
physical_chains:
  - {id: bevel_in, kind: PHYSICAL_DECAL_SOURCE, source_lineage: bevel_in_semantic_line}
  - {id: bevel_out, kind: PHYSICAL_DECAL_SOURCE, source_lineage: bevel_out_semantic_line}
  - {id: other_wing, kind: PHYSICAL_DECAL_SOURCE, source_lineage: other_wing_semantic_line}
chain_uses:
  - {id: bevel_in_use, physical_chain: bevel_in, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: bevel_out_use, physical_chain: bevel_out, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
  - {id: other_wing_use, physical_chain: other_wing, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_bevel_in_use, kind: FrontSeed, chain_use: bevel_in_use, owner_patch: owner_patch, sectors: [bevel_in_use_left, bevel_in_use_right]}
  - {id: front_seed_bevel_out_use, kind: FrontSeed, chain_use: bevel_out_use, owner_patch: owner_patch, sectors: [bevel_out_use_left, bevel_out_use_right]}
  - {id: front_seed_other_wing_use, kind: FrontSeed, chain_use: other_wing_use, owner_patch: owner_patch, sectors: [other_wing_use_left, other_wing_use_right]}
  - {id: corner_seed_bevel, kind: CornerSeed, source_relation: CORNER_SEED_BEVEL, owner_patch: owner_patch, incident_chain_uses: [bevel_in_use, bevel_out_use, other_wing_use]}
front_components:
  - {id: fc_bevel_in_use_left, chain_use: bevel_in_use, owner_patch: owner_patch, sector: bevel_in_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_bevel_in_use_right, chain_use: bevel_in_use, owner_patch: owner_patch, sector: bevel_in_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_bevel_out_use_left, chain_use: bevel_out_use, owner_patch: owner_patch, sector: bevel_out_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_bevel_out_use_right, chain_use: bevel_out_use, owner_patch: owner_patch, sector: bevel_out_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_other_wing_use_left, chain_use: other_wing_use, owner_patch: owner_patch, sector: other_wing_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_other_wing_use_right, chain_use: other_wing_use, owner_patch: owner_patch, sector: other_wing_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [bevel_in_use, bevel_out_use, other_wing_use], seeds: [front_seed_bevel_in_use, front_seed_bevel_out_use, front_seed_other_wing_use, corner_seed_bevel], front_components: [fc_bevel_in_use_left, fc_bevel_in_use_right, fc_bevel_out_use_left, fc_bevel_out_use_right, fc_other_wing_use_left, fc_other_wing_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_bevel_in_use, kind: StripEnvelope, seed: front_seed_bevel_in_use, chain_use: bevel_in_use, front_components: [fc_bevel_in_use_left, fc_bevel_in_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_bevel_out_use, kind: StripEnvelope, seed: front_seed_bevel_out_use, chain_use: bevel_out_use, front_components: [fc_bevel_out_use_left, fc_bevel_out_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: strip_other_wing_use, kind: StripEnvelope, seed: front_seed_other_wing_use, chain_use: other_wing_use, front_components: [fc_other_wing_use_left, fc_other_wing_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
  - {id: contribution_corner_seed_bevel, kind: CornerEnvelope, seed: corner_seed_bevel, chain_uses: [bevel_in_use, bevel_out_use, other_wing_use], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events: []
capacity_states:
  - {front_component: fc_bevel_in_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_bevel_in_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_bevel_out_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_bevel_out_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_other_wing_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_other_wing_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_BOUNDARY_RESOLVED_OR_REQUESTED, capacity_reason: NONE_OR_PRECEDING_BOUNDARY_CAPACITY, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_bevel_in_use, strip_bevel_out_use, strip_other_wing_use, contribution_corner_seed_bevel], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions:
  - {id: interaction_main, kind: BEVEL_CHORD_CONTACT, participants: [fc_bevel_in_use_left, fc_bevel_in_use_right, fc_bevel_out_use_left, fc_bevel_out_use_right, fc_other_wing_use_left, fc_other_wing_use_right], gate: MUTUAL_ARRIVAL_OR_DECLARED_EVENT, coverage_effect: CLIP_EXISTING_CONTRIBUTIONS, owner_patch: owner_patch}
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c13-bevel-foreign-collision.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c13-bevel-foreign-collision.png
