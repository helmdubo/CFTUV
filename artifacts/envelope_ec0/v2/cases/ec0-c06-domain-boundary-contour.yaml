schema: cftuv.envelope.ec0.case.v2
case_id: EC0-C06
slug: domain-boundary-contour
title: Domain clipping follows the physical contour
status: DEFINED
pivot_policy:
  propagation: BOUNDARY_LIMITED_PROPAGATION
  front_component_key: [CHAIN_USE, OWNER_PATCH, SECTOR]
  branch_count_rule: NON_INCREASING
semantic_contracts:
  - id: C06-S1
    authority: FIELD_PROVEN
    rule: Coverage is clipped at an exact boundary event and may follow only the unambiguous continuation of the same physical boundary component.
  - id: C06-S2
    authority: MATHEMATICALLY_REQUIRED
    rule: Boundary lineage retains the domain edge sequence; a chord across a contour turn is not equivalent.
  - id: C06-S3
    authority: FIELD_PROVEN
    rule: Opposite contacts, other pChains, and the opposite patch-side use have independent FrontComponent lifecycle.
  - id: C06-S4
    authority: USER_REQUIRED
    rule: If following a hole or concave contour would increase active branch count, propagation saturates with BARRIER_SPLIT_REQUIRED instead of bypassing the obstacle.
skeleton:
  nodes:
    - {id: start, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_START]}
    - {id: end, kind: PHYSICAL_ENDPOINT, roles: [SEMANTIC_END]}
  edges:
    - {id: spine, kind: SELECTED_SPINE, from: start, to: end}
  barriers:
    - {id: contour, kind: DOMAIN_BOUNDARY, topology: ORDERED_PHYSICAL_CONTOUR}
envelopes:
  - {id: strip, kind: StripEnvelope, source: spine, alpha_law: TWO_SIDED_LINEAR}
region_graph:
  regions:
    - {id: clipped_body, semantic_kind: STRIP, owner: strip, station_model: SPINE_S, domain_membership: INSIDE}
  edges: []
boundary_lineage:
  - {boundary: free_side, lineage: [strip, spine], role: COVERAGE_SILHOUETTE}
  - {boundary: clipped_side, lineage: [contour, ORDERED_TRAVERSED_SEGMENTS], role: DOMAIN_AND_COVERAGE_SILHOUETTE}
  - {boundary: contact_start, lineage: [strip, contour, CONTACT_EVENT], role: SEMANTIC_ANCHOR}
  - {boundary: contact_end, lineage: [strip, contour, CONTACT_EVENT], role: SEMANTIC_ANCHOR}
owners:
  total: true
  disjoint: true
  tie_boundary_owner: NONE
  domain_boundary_owner: NONE
adjacency:
  - {a: clipped_body, b: OUTSIDE_DOMAIN, through: clipped_side}
s_direction:
  authority: SEMANTIC_START_TO_END
  boundary_contact_parameter: CONTOUR_STATION_WITHOUT_S_RESET
  opposite_contact_coupling: NONE
alpha_evolution:
  - {stage: before_contact, coverage: FREE_STRIP_INSIDE_DOMAIN, topology: NO_DOMAIN_CONTACT}
  - {stage: at_contact, coverage: EXACT_AFTER_STATE_CLIP, topology: BOUNDARY_CONTACT_EVENT}
  - {stage: after_contact_without_branching, coverage: ACTIVE_INTERVAL_SHRINKS_AND_CONTACT_SLIDES, topology: BRANCH_COUNT_UNCHANGED}
  - {stage: bypass_required, coverage: LAST_UNAMBIGUOUS_STATE, topology: BOUNDARY_CAPACITY_REACHED}
topology_events:
  - {id: contact, kind: BOUNDARY_CONTACT, height: ALPHA_CONTACT, application: CLOSED_AT_AND_AFTER}
  - {id: contour_turn, kind: LINEAGE_CONTINUATION, height: ALPHA_TURN, precondition: NO_BRANCH_COUNT_INCREASE}
  - {id: barrier_split_required, kind: SATURATION, height: ALPHA_BYPASS_REQUIRED, capacity_reason: BARRIER_SPLIT_REQUIRED}
front_component_state:
  active_intervals: REQUIRED
  completion: FRONT_EXHAUSTED_WHEN_EMPTY_OR_FULLY_FROZEN
  requested_alpha: PRESERVED
  effective_alpha: CLAMP_ONLY_AT_PROVEN_CAPACITY
forbidden:
  - CHORD_ACROSS_CONTOUR_TURN
  - CLIP_AGAINST_DERIVED_CHAIN_ENDPOINT
  - COUPLED_OPPOSITE_REACH
  - COVERAGE_OUTSIDE_DOMAIN
  - FIRST_OR_LAST_FRONT_VERTEX_DECIDES_COMPLETION
  - BOUNDARY_CROSS_THEN_ROLLBACK
  - FRONT_BRANCH_COUNT_INCREASE
  - MATERIAL_TELEPORTS_BEHIND_HOLE_OR_BARRIER
  - ONE_COMPONENT_STOPS_OTHER_COMPONENTS
metamorphic_expectations:
  matrix_row: EC0-C06
  matrix_schema: cftuv.envelope.ec0.metamorphic_matrix.v2
  pivot_required: [physical_chain_enumeration_permutation, chain_use_enumeration_permutation, seed_enumeration_permutation, front_component_enumeration_permutation, front_vertex_resampling, boundary_resegmentation_same_physical_contour, patch_domain_identity_preserving_rekey]
  pivot_semantic_changes: [private_domain_per_pchain_policy_switch, owner_patch_reassignment]
  required: [chain_enumeration_permutation, chain_storage_reverse, surface_winding_reverse, rigid_translation, coherent_uniform_scale, source_retriangulation, data_chain_split_merge, simultaneous_event_enumeration_permutation, small_perturbation_without_topology_change]
  semantic_changes: [semantic_start_end_swap]
canonical_digest_projection:
  include: [pivot_policy, front_component_state, region_graph, boundary_lineage, owners, adjacency, s_direction, topology_events, semantic_anchors, domain_membership]
  exclude: [face_order, tessellation, contour_chord, data_chain_partition]

patch_domains:
  - {id: domain_main, owner_patch: owner_patch, surface_regime: INTRINSIC_PATCH_SURFACE, outer_boundary: outer_loop, holes: [], barriers: [OUTER_OR_HOLE_OR_EXPLICIT_BARRIER], sectors: [route_use_left, route_use_right]}
physical_chains:
  - {id: route, kind: PHYSICAL_DECAL_SOURCE, source_lineage: route_semantic_line}
chain_uses:
  - {id: route_use, physical_chain: route, owner_patch: owner_patch, patch_domain: domain_main, boundary_loop: source_loop, orientation: SEMANTIC_START_TO_END, side: OWNER_INTERIOR, roles: [DECAL_SOURCE]}
seeds:
  - {id: front_seed_route_use, kind: FrontSeed, chain_use: route_use, owner_patch: owner_patch, sectors: [route_use_left, route_use_right]}
front_components:
  - {id: fc_route_use_left, chain_use: route_use, owner_patch: owner_patch, sector: route_use_left, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
  - {id: fc_route_use_right, chain_use: route_use, owner_patch: owner_patch, sector: route_use_right, active_intervals: ONE_OR_ZERO_EVENT_DRIVEN, branch_count: NON_INCREASING_FROM_ONE, lifecycle: COMPILE_TRACKED}
evaluation_groups:
  - {id: patch_eval_owner, owner_patch: owner_patch, patch_domain: domain_main, chain_uses: [route_use], seeds: [front_seed_route_use], front_components: [fc_route_use_left, fc_route_use_right], unit: ONE_PATCH_ALL_ACTIVE_SOURCES}
coverage_contributions:
  - {id: strip_route_use, kind: StripEnvelope, seed: front_seed_route_use, chain_use: route_use, front_components: [fc_route_use_left, fc_route_use_right], owner_patch: owner_patch, boundary_resolution: RESOLVED_BEFORE_PATCH_UNION}
boundary_events:
  - {id: event_1_boundary_contact, kind: BOUNDARY_CONTACT, exact_height_key: ALPHA_BOUNDARY_CONTACT, boundary_provenance: [domain_main, OUTER_OR_HOLE_OR_EXPLICIT_BARRIER], atomic_batch: CASE_DECLARED_BATCH_OR_PARTIAL_ORDER, active_interval_transition: COMPILE_DECLARED_AFTER_STATE}
  - {id: event_2_barrier_split_required, kind: BARRIER_SPLIT_REQUIRED, exact_height_key: ALPHA_BARRIER_SPLIT_REQUIRED, boundary_provenance: [domain_main, OUTER_OR_HOLE_OR_EXPLICIT_BARRIER], atomic_batch: CASE_DECLARED_BATCH_OR_PARTIAL_ORDER, active_interval_transition: COMPILE_DECLARED_AFTER_STATE}
capacity_states:
  - {front_component: fc_route_use_left, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
  - {front_component: fc_route_use_right, requested_alpha: SHARED_PATCH_INPUT, effective_alpha: PER_COMPONENT_LAST_PROVEN_OR_REQUESTED, capacity_reason: BARRIER_SPLIT_REQUIRED_OR_PROVEN_ROUTE_END, terminal_outcome: NAMED_OR_NONE}
patch_coverage:
  - {id: resolved_patch_coverage, evaluation_group: patch_eval_owner, domain: domain_main, operation: EXACT_SINGLE_COVER_UNION, contributions: [strip_route_use], reachability: PROVEN_FROM_SEEDS, ownership_applied_after: true}
interactions: []
pivot_digest_projection:
  include: [patch_domains, physical_chains, chain_uses, seeds, front_components, evaluation_groups, coverage_contributions, boundary_events, capacity_states, patch_coverage, interactions]
  exclude: [record_order, runtime_front_vertices, private_pchain_domains, sampled_tessellation, tolerance_selected_topology]
visuals:
  svg: artifacts/envelope_ec0/v2/sheets/ec0-c06-domain-boundary-contour.svg
  png: artifacts/envelope_ec0/v2/sheets/ec0-c06-domain-boundary-contour.png
