  all_semantic_change: &all_semantic_change {EC0-C01: SEMANTIC_CHANGE, EC0-C02: SEMANTIC_CHANGE, EC0-C03: SEMANTIC_CHANGE, EC0-C04: SEMANTIC_CHANGE, EC0-C05: SEMANTIC_CHANGE, EC0-C06: SEMANTIC_CHANGE, EC0-C07: SEMANTIC_CHANGE, EC0-C08: SEMANTIC_CHANGE, EC0-C09: SEMANTIC_CHANGE, EC0-C10: SEMANTIC_CHANGE, EC0-C11: SEMANTIC_CHANGE, EC0-C12: SEMANTIC_CHANGE, EC0-C13: SEMANTIC_CHANGE, EC0-C14: SEMANTIC_CHANGE, EC0-C15: SEMANTIC_CHANGE, EC0-C16: SEMANTIC_CHANGE}
