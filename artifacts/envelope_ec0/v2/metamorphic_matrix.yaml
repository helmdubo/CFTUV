  - transform: chain_enumeration_permutation
    definition: Reorder input chain records without changing identities or roles.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: chain_storage_reverse
    definition: Reverse stored samples while preserving semantic START and END identities.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: surface_winding_reverse
    definition: Reverse face winding and normals as storage orientation only; semantic sides are preserved.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: rigid_translation
    definition: Translate every geometric input and anchor together.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: coherent_uniform_scale
    definition: Scale geometry, alpha, station distances, and lift by the same positive factor.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: source_retriangulation
    definition: Change only source tessellation while preserving the same physical surface and semantic edges.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: data_chain_split_merge
    definition: Split or merge data-chain records while preserving one physical semantic line.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: simultaneous_event_enumeration_permutation
    definition: Reorder events with one exact event height; the event batch is unchanged.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: small_perturbation_without_topology_change
    definition: Perturb geometry without crossing an incidence, ordering, ownership, or event-height equality.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: semantic_start_end_swap
    definition: Swap semantic START and END, intentionally reversing the s authority.
    by_case: {EC0-C01: SEMANTIC_CHANGE, EC0-C02: SEMANTIC_CHANGE, EC0-C03: SEMANTIC_CHANGE, EC0-C04: SEMANTIC_CHANGE, EC0-C05: SEMANTIC_CHANGE, EC0-C06: SEMANTIC_CHANGE, EC0-C07: SEMANTIC_CHANGE, EC0-C08: SEMANTIC_CHANGE, EC0-C09: SEMANTIC_CHANGE, EC0-C10: SEMANTIC_CHANGE, EC0-C11: SEMANTIC_CHANGE, EC0-C12: SEMANTIC_CHANGE, EC0-C13: SEMANTIC_CHANGE, EC0-C14: SEMANTIC_CHANGE, EC0-C15: SEMANTIC_CHANGE, EC0-C16: SEMANTIC_CHANGE}
  - transform: corner_join_switch
    definition: Change an applicable corner policy between MITER and BEVEL.
    by_case: {EC0-C01: INVARIANT, EC0-C02: SEMANTIC_CHANGE, EC0-C03: SEMANTIC_CHANGE, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: SEMANTIC_CHANGE, EC0-C12: INVARIANT, EC0-C13: SEMANTIC_CHANGE, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: INVARIANT}
  - transform: capacity_policy_switch
    definition: Change the declared plan capacity policy.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: SEMANTIC_CHANGE, EC0-C15: SEMANTIC_CHANGE, EC0-C16: INVARIANT}
  - transform: intrapatch_wing_policy_switch
    definition: Switch same-decal same-Patch wing collision among AM4 alternatives A, B, and C.
    by_case: {EC0-C01: INVARIANT, EC0-C02: INVARIANT, EC0-C03: INVARIANT, EC0-C04: INVARIANT, EC0-C05: INVARIANT, EC0-C06: INVARIANT, EC0-C07: INVARIANT, EC0-C08: INVARIANT, EC0-C09: INVARIANT, EC0-C10: INVARIANT, EC0-C11: INVARIANT, EC0-C12: INVARIANT, EC0-C13: INVARIANT, EC0-C14: INVARIANT, EC0-C15: INVARIANT, EC0-C16: SEMANTIC_CHANGE}
  - transform: physical_chain_enumeration_permutation
    definition: Reorder PhysicalChain records while preserving physical identities and all ChainUse references.
    by_case: *all_invariant
  - transform: chain_use_enumeration_permutation
    definition: Reorder directed ChainUse records inside their owner Patch evaluation group.
    by_case: *all_invariant
  - transform: seed_enumeration_permutation
    definition: Reorder compile-static Front, Corner, Junction, and Cap seeds without changing provenance.
    by_case: *all_invariant
  - transform: front_component_enumeration_permutation
    definition: Reorder FrontComponent records while preserving use, Patch, sector, active intervals, and event history.
    by_case: *all_invariant
  - transform: front_vertex_resampling
    definition: Resample a runtime front while preserving the same continuous active intervals and exact event keys.
    by_case: *all_invariant
  - transform: boundary_resegmentation_same_physical_contour
    definition: Split or merge boundary records while preserving the physical contour, domain interior, holes, and BARRIER roles.
    by_case: *all_invariant
  - transform: patch_domain_identity_preserving_rekey
    definition: Rename PatchDomain and evaluation-group storage keys while preserving semantic identity and all references.
    by_case: *all_invariant
  - transform: private_domain_per_pchain_policy_switch
    definition: Replace the one-Patch evaluation field with private solve domains per pChain or ChainUse.
    by_case: *all_semantic_change
  - transform: owner_patch_reassignment
    definition: Move a ChainUse or FrontComponent to another owner Patch while keeping geometry unchanged.
    by_case: *all_semantic_change
