schema: cftuv.envelope.ec0.pivot_topology_metamorphic_matrix.v1
cases: [PTS-01, PTS-02, PTS-03, PTS-04]
verdict_sets:
  invariant_all: &invariant_all {PTS-01: INVARIANT, PTS-02: INVARIANT, PTS-03: INVARIANT, PTS-04: INVARIANT}
  change_all: &change_all {PTS-01: SEMANTIC_CHANGE, PTS-02: SEMANTIC_CHANGE, PTS-03: SEMANTIC_CHANGE, PTS-04: SEMANTIC_CHANGE}
verdicts:
  - {transform: physical_chain_enumeration_permutation, by_case: *invariant_all}
  - {transform: chain_use_enumeration_permutation, by_case: *invariant_all}
  - {transform: seed_enumeration_permutation, by_case: *invariant_all}
  - {transform: front_component_enumeration_permutation, by_case: *invariant_all}
  - {transform: semantic_identity_rekey, by_case: *invariant_all}
  - {transform: private_domain_per_pchain_policy_switch, by_case: *change_all}
  - {transform: owner_patch_reassignment, by_case: *change_all}
  - transform: reverse_one_chain_use_orientation
    by_case: {PTS-01: SEMANTIC_CHANGE, PTS-02: SEMANTIC_CHANGE, PTS-03: SEMANTIC_CHANGE, PTS-04: SEMANTIC_CHANGE}
  - transform: merge_chain_uses_by_physical_chain_id
    by_case: {PTS-01: SEMANTIC_CHANGE, PTS-02: SEMANTIC_CHANGE, PTS-03: INVARIANT, PTS-04: INVARIANT}
  - transform: physical_seam_to_seam_self_reclassification
    by_case: {PTS-01: SEMANTIC_CHANGE, PTS-02: SEMANTIC_CHANGE, PTS-03: INVARIANT, PTS-04: INVARIANT}
  - transform: interaction_policy_b_to_a_or_c
    by_case: {PTS-01: INVARIANT, PTS-02: INVARIANT, PTS-03: INVARIANT, PTS-04: SEMANTIC_CHANGE}
