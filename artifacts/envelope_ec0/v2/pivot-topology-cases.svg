<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f7bbd"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172333}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#577083}.pt{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px;fill:#506777}.domain{fill:#f6fbff;stroke:#8098aa;stroke-width:3;stroke-dasharray:10 7}.chain{stroke:#2f7bbd;stroke-width:7;stroke-linecap:round}.use{stroke:#83c99b;stroke-width:5;marker-end:url(#arrow)}.event{stroke:#e6a23c;stroke-width:5;stroke-dasharray:8 6}.bad{fill:#fff1f5;stroke:#cc4e9b}.ok{fill:#e8f5ec;stroke:#83c99b}</style>
  </defs>
  <rect width="1600" height="1000" fill="#edf3f7"/>
  <text x="42" y="54" class="title">EC0-P · AM7 topology pivot cases</text>
  <text x="42" y="84" class="sub">Physical identity, directed uses, patch-level evaluation and self-collision — no coordinates are normative.</text>

  <g transform="translate(42 118)">
    <rect width="738" height="390" rx="24" fill="#fff" stroke="#bfd0dc"/>
    <text x="26" y="42" class="pt">PTS-01 · Physical seam A/B</text>
    <rect x="34" y="72" width="300" height="172" rx="20" class="domain"/><rect x="404" y="72" width="300" height="172" rx="20" class="domain"/>
    <text x="58" y="104" class="label">PatchDomain A</text><text x="428" y="104" class="label">PatchDomain B</text>
    <line x1="168" y1="152" x2="570" y2="152" class="chain"/><text x="260" y="140" class="small">one PhysicalChain</text>
    <line x1="282" y1="184" x2="96" y2="184" class="use"/><line x1="456" y1="184" x2="642" y2="184" class="use"/>
    <text x="90" y="218" class="small">ChainUse A</text><text x="566" y="218" class="small">ChainUse B</text>
    <rect x="34" y="270" width="300" height="76" rx="16" class="ok"/><rect x="404" y="270" width="300" height="76" rx="16" class="ok"/>
    <text x="184" y="302" text-anchor="middle" class="label">evaluation A</text><text x="554" y="302" text-anchor="middle" class="label">evaluation B</text>
    <text x="184" y="329" text-anchor="middle" class="small">capacity independent</text><text x="554" y="329" text-anchor="middle" class="small">no cross-Patch collision</text>
  </g>

  <g transform="translate(820 118)">
    <rect width="738" height="390" rx="24" fill="#fff" stroke="#bfd0dc"/>
    <text x="26" y="42" class="pt">PTS-02 · SEAM_SELF</text>
    <rect x="34" y="72" width="670" height="172" rx="20" class="domain"/><text x="58" y="104" class="label">one PatchDomain</text>
    <line x1="176" y1="150" x2="562" y2="150" class="chain"/><text x="270" y="138" class="small">one PhysicalChain</text>
    <line x1="348" y1="182" x2="128" y2="182" class="use"/><line x1="390" y1="182" x2="610" y2="182" class="use"/>
    <text x="112" y="218" class="small">left directed use</text><text x="515" y="218" class="small">right directed use</text>
    <rect x="88" y="270" width="562" height="76" rx="16" class="ok"/><text x="369" y="302" text-anchor="middle" class="label">one patch evaluation, two distinct uses</text><text x="369" y="329" text-anchor="middle" class="small">shared physical id never merges their lifecycle</text>
  </g>

  <g transform="translate(42 548)">
    <rect width="738" height="390" rx="24" fill="#fff" stroke="#bfd0dc"/>
    <text x="26" y="42" class="pt">PTS-03 · Multiple pChains, one Patch</text>
    <rect x="34" y="72" width="670" height="172" rx="20" class="domain"/><text x="58" y="104" class="label">one shared PatchDomain</text>
    <line x1="100" y1="148" x2="304" y2="148" class="chain"/><line x1="434" y1="190" x2="638" y2="190" class="chain"/>
    <text x="144" y="136" class="small">pChain A + FrontSeed A</text><text x="470" y="178" class="small">pChain B + FrontSeed B</text>
    <line x1="310" y1="148" x2="388" y2="168" class="use"/><line x1="428" y1="190" x2="350" y2="170" class="use"/>
    <rect x="88" y="270" width="562" height="76" rx="16" class="ok"/><text x="369" y="302" text-anchor="middle" class="label">one evaluator invocation contains all sources</text><text x="369" y="329" text-anchor="middle" class="small">union/interactions occur only after boundary resolution</text>
  </g>

  <g transform="translate(820 548)">
    <rect width="738" height="390" rx="24" fill="#fff" stroke="#bfd0dc"/>
    <text x="26" y="42" class="pt">PTS-04 · One-wing self-collision</text>
    <rect x="34" y="72" width="670" height="172" rx="20" class="domain"/><text x="58" y="104" class="label">same decal · same owner Patch</text>
    <path d="M108 196 C240 100 270 214 360 160 C450 106 488 218 630 126" fill="none" class="chain"/>
    <circle cx="329" cy="175" r="8" fill="#e6a23c"/><line x1="329" y1="120" x2="329" y2="228" class="event"/>
    <text x="82" y="228" class="small">reading A</text><text x="570" y="228" class="small">reading B</text><text x="345" y="130" class="small">mutual equality</text>
    <rect x="88" y="270" width="562" height="76" rx="16" class="ok"/><text x="369" y="302" text-anchor="middle" class="label">selected B: clip existing wing coverage</text><text x="369" y="329" text-anchor="middle" class="small">no overlap, no third matter, both station readings survive</text>
  </g>
</svg>
