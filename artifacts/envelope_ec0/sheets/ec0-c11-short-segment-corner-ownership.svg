<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C11 Short segment corner ownership</title><desc id="d">Two corner claims meet at an ownerless physical midpoint divider.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cc{fill:#fbcfe8;stroke:#be185d;stroke-width:3}.cb{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:5;stroke-dasharray:10 8}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C11 · Corner-owner на коротком segment · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M190 165H540"/><circle cx="190" cy="165" r="15" fill="#be185d"/><circle cx="540" cy="165" r="15" fill="#15803d"/><text class="n" x="145" y="210">corner A</text><text class="n" x="515" y="210">corner B</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M125 105H605L665 165L605 225H125L65 165Z"/><text class="n" x="265" y="170">one union at every α</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><path class="cc" d="M65 165L125 105H355V225H125Z"/><path class="cb" d="M355 105H605L665 165L605 225H355Z"/><path class="dv" d="M355 105V225"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><text class="n" x="158" y="170">owner A</text><text class="n" x="488" y="170">owner B</text><text class="n" x="368" y="95">ownerless midpoint</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M120 165H355"/><path class="fl" d="M590 205H355"/><path class="dv" d="M355 105V225"/><text class="n" x="120" y="210">sA →</text><text class="n" x="500" y="235">← sB</text><text class="n" x="375" y="170">physical divider</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cc" d="M25 62L65 30H150V95H65Z"/><rect class="ca" x="150" y="30" width="80" height="65"/><path class="cb" d="M230 30H315L355 62L315 95H230Z"/><text class="n" x="105" y="118">body exists</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="cc" d="M20 62L60 25H190V100H60Z"/><path class="cb" d="M190 25H320L360 62L320 100H190Z"/><path class="dv" d="M190 25V100"/><text class="n" x="105" y="120">collapse at divider</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cc" d="M10 62L55 15H190V110H55Z"/><path class="cb" d="M190 15H325L370 62L325 110H190Z"/><path class="dv" d="M190 15V110"/><text class="n" x="98" y="123">disjoint owners remain</text></g></g>
</svg>

