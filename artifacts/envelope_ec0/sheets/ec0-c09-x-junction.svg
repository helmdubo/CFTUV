<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C09 X junction</title><desc id="d">Four-arm junction with declared horizontal and vertical route pairing.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.cj{fill:#fde68a;stroke:#b45309;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:4;stroke-dasharray:9 7}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C09 · X-junction с route pairing · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M100 165H610M355 55V275"/><circle cx="355" cy="165" r="12" fill="#b45309"/><text class="n" x="370" y="154">A: W→E</text><text class="n" x="370" y="180">B: S→N</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M80 115H300V40H410V115H630V215H410V290H300V215H80Z"/><text class="n" x="280" y="170">one four-arm union</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><rect class="ca" x="80" y="115" width="220" height="100"/><rect class="ca" x="410" y="115" width="220" height="100"/><rect class="cb" x="300" y="40" width="110" height="75"/><rect class="cb" x="300" y="215" width="110" height="75"/><rect class="cj" x="300" y="115" width="110" height="100"/><path class="dv" d="M300 165H410M355 115V215"/><text class="n" x="318" y="160">A/B</text><text class="n" x="315" y="188">sectors</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M90 165H620"/><path class="fl" d="M355 270V55"/><text class="n" x="190" y="205">route A s</text><text class="n" x="375" y="75">route B s</text><text class="n" x="430" y="245">pairing is input, not id order</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="sk" d="M35 62H345M190 15V110"/><text class="n" x="125" y="122">paired X</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="ca" d="M25 45H155V12H225V45H355V82H225V115H155V82H25Z"/><text class="n" x="120" y="122">core born</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cj" d="M145 25H235V105H145Z"/><path class="dv" d="M145 65H235M190 25V105"/><text class="n" x="250" y="70">two station sectors</text></g></g>
</svg>

