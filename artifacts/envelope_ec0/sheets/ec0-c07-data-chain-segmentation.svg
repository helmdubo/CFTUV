<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C07 Data-chain segmentation</title><desc id="d">A storage split on one physical line has no semantic effect.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.store{fill:none;stroke:#94a3b8;stroke-width:4;stroke-dasharray:6 7}.cross{stroke:#be185d;stroke-width:5}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#ecfeff;stroke:#0891b2;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C07 · Data-chain split ≠ physical end · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M100 165H610"/><path class="cross" d="M355 135V195"/><text class="n" x="300" y="225">storage split only</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><rect class="ca" x="100" y="105" width="510" height="120"/><path class="store" d="M355 105V225"/><text class="n" x="220" y="165">one physical StripEnvelope</text><text class="n" x="365" y="248">no silhouette</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><rect class="ca" x="100" y="105" width="510" height="120"/><path class="store" d="M355 105V225"/><text class="n" x="180" y="165">same owner across split</text><text class="n" x="364" y="95">no adjacency</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M100 165H610"/><path class="cross" d="M355 135V195"/><text class="n" x="245" y="225">s continuous · no reset</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="sk" d="M40 62H330"/><path class="cross" d="M185 40V84"/><text class="n" x="115" y="112">two records</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><rect class="ca" x="35" y="35" width="300" height="55"/><path class="store" d="M185 35V90"/><text class="n" x="110" y="116">one envelope</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><rect class="ca" x="20" y="22" width="335" height="82"/><text class="n" x="93" y="122">digest normalized</text></g></g>
</svg>

