  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M90 80Q350 15 620 95V240Q350 285 90 220Z"/><text class="n" x="250" y="165">silhouette = envelope union</text></g>
