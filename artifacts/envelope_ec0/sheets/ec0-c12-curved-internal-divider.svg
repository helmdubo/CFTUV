<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C12 Curved internal divider</title><desc id="d">An exact curved ownership divider stays inside unchanged envelope coverage.</desc>
