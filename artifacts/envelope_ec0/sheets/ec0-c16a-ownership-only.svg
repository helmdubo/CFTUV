<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C16A same-decal wing ownership only</title><desc id="d">Rejected alternative A keeps the wing union coverage and uses the freeze locus only as a station and UV divider.</desc>
  <defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sa{fill:none;stroke:#2563eb;stroke-width:8;marker-end:url(#arrA)}.sb{fill:none;stroke:#15803d;stroke-width:8;marker-end:url(#arrB)}.ca{fill:#bfdbfe;fill-opacity:.78;stroke:#2563eb;stroke-width:3}.cb{fill:#bbf7d0;fill-opacity:.78;stroke:#15803d;stroke-width:3}.ov{fill:#ddd6fe;stroke:#7c3aed;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:6;stroke-dasharray:10 8}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:3}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C16A · Ownership only · REJECTED BY USER</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON · ONE DECAL / ONE PATCH</text><path class="sa" d="M90 165H335"/><path class="sb" d="M640 165H395"/><text class="n" x="90" y="205">wing from pChain A</text><text class="n" x="505" y="205">wing from pChain B</text><text class="n" x="220" y="270">same contract would cover self-collision</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M70 100H400Q500 165 400 230H70Z"/><path class="cb" d="M660 100H330Q230 165 330 230H660Z"/><path class="ov" d="M330 100H400Q500 165 400 230H330Q230 165 330 100Z"/><text class="n" x="275" y="275">primitive union unchanged</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · STATION / UV CLAIMS</text><path class="ca" d="M70 100H365V230H70Z"/><path class="cb" d="M365 100H660V230H365Z"/><path class="dv" d="M365 90V240"/><text class="n" x="115" y="170">station claim A</text><text class="n" x="450" y="170">station claim B</text><text class="n" x="375" y="90">freeze divider</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="sa" d="M80 165H350"/><path class="sb" d="M650 205H380"/><path class="dv" d="M365 90V240"/><text class="n" x="105" y="215">sA →</text><text class="n" x="560" y="240">← sB</text><text class="n" x="385" y="165">two readings retained</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><rect class="ca" x="25" y="40" width="115" height="50"/><rect class="cb" x="240" y="40" width="115" height="50"/><text class="n" x="103" y="118">before meet</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><rect class="ca" x="25" y="35" width="175" height="60"/><rect class="cb" x="180" y="35" width="175" height="60"/><path class="dv" d="M190 25V105"/><text class="n" x="115" y="120">first contact</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><rect class="ov" x="125" y="20" width="130" height="90"/><path class="dv" d="M190 15V115"/><text class="n" x="65" y="123">overlap stays, owner split</text></g></g>
