<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C16C same-decal wing collision creates new matter</title><desc id="d">Rejected alternative C creates a third matter region when two wings of one decal and Patch meet.</desc>
  <defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sa{fill:none;stroke:#2563eb;stroke-width:8;marker-end:url(#arrA)}.sb{fill:none;stroke:#15803d;stroke-width:8;marker-end:url(#arrB)}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.cc{fill:#fbcfe8;stroke:#be185d;stroke-width:4}.dv{fill:none;stroke:#d97706;stroke-width:6;stroke-dasharray:10 8}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fdf2f8;stroke:#be185d;stroke-width:3}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C16C · Freeze порождает новую материю · REJECTED BY USER</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON · ONE DECAL / ONE PATCH</text><path class="sa" d="M90 165H330"/><path class="sb" d="M640 165H400"/><circle cx="365" cy="165" r="18" fill="#be185d"/><text class="n" x="75" y="210">pChain A wing</text><text class="n" x="530" y="210">pChain B wing</text><text class="n" x="270" y="260">rejected new-matter operator</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · RESOLVED COVERAGE</text><path class="ca" d="M70 110H300L345 145V185L300 220H70Z"/><path class="cb" d="M660 110H430L385 145V185L430 220H660Z"/><path class="cc" d="M345 145L365 85L385 145V185L365 245L345 185Z"/><text class="n" x="395" y="265">third matter changes union</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><path class="ca" d="M70 110H300L345 145V185L300 220H70Z"/><path class="cb" d="M660 110H430L385 145V185L430 220H660Z"/><path class="cc" d="M345 145L365 85L385 145V185L365 245L345 185Z"/><text class="n" x="310" y="270">owner = interaction</text><text class="n" x="105" y="170">owner A</text><text class="n" x="535" y="170">owner B</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="sa" d="M80 165H335"/><path class="sb" d="M650 205H395"/><path class="cc" d="M345 145L365 105L385 145V185L365 225L345 185Z"/><text class="n" x="235" y="255">A model</text><text class="n" x="470" y="255">B model</text><text class="n" x="285" y="92">new UV/station model required</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><rect class="ca" x="25" y="40" width="115" height="50"/><rect class="cb" x="240" y="40" width="115" height="50"/><text class="n" x="103" y="118">before meet</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="ca" d="M25 35H175V95H25Z"/><path class="cb" d="M355 35H205V95H355Z"/><path class="cc" d="M175 55L190 25L205 55V75L190 105L175 75Z"/><text class="n" x="82" y="120">new region born</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cc" d="M145 45L190 5L235 45V85L190 120L145 85Z"/><text class="n" x="246" y="65">third owner</text><text class="n" x="88" y="122">new matter grows by own law</text></g></g>
