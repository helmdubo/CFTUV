<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C08 T junction</title><desc id="d">Three-arm junction coverage, junction owner sectors and station flow.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.cj{fill:#fde68a;stroke:#b45309;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:4;stroke-dasharray:9 7}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C08 · T-junction · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M100 210H610M355 210V65"/><circle cx="355" cy="210" r="12" fill="#b45309"/><text class="n" x="372" y="202">degree 3</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M80 155H300V55H410V155H630V265H80Z"/><text class="n" x="275" y="210">one union · no hole</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><rect class="ca" x="80" y="155" width="230" height="110"/><rect class="ca" x="400" y="155" width="230" height="110"/><rect class="cb" x="300" y="55" width="110" height="110"/><path class="cj" d="M300 155H410V265H300Z"/><path class="dv" d="M300 210H410M355 155V265"/><text class="n" x="317" y="198">junction</text><text class="n" x="315" y="235">sectors</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M90 210H620"/><path class="fl" d="M355 210V65"/><text class="n" x="210" y="250">trunk s continuous</text><text class="n" x="370" y="85">branch s=0 at junction</text><path class="dv" d="M300 210H410"/></g>
