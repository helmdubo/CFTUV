<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C04 Reflex corner</title><desc id="d">Reflex corner coverage has an inner notch and no exterior wedge.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#fde68a;stroke:#b45309;stroke-width:2}.dv{fill:none;stroke:#d97706;stroke-width:4;stroke-dasharray:10 8}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C04 · Reflex corner · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M110 95H360V245"/><circle cx="360" cy="95" r="11" fill="#2563eb"/><text class="n" x="375" y="100">reflex turn</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M80 45H420V255H300V145H80Z"/><text class="n" x="235" y="185">inner notch</text><path class="dv" d="M300 145H420"/><text class="n" x="430" y="150">no outer wedge</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><path class="ca" d="M80 45H360V145H80Z"/><path class="ca" d="M300 145H420V255H300Z"/><path class="cb" d="M300 45H420V145H300Z"/><path class="dv" d="M300 45V145H420"/><text class="n" x="323" y="102">reflex interface</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M100 95H360V245"/><path stroke="#7c3aed" stroke-width="3" d="M180 75V115M270 75V115M340 155H380M340 205H380"/><text class="n" x="90" y="140">s=0</text><text class="n" x="382" y="238">s continues</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="sk" d="M55 35H200V100"/><text class="n" x="230" y="72">α=0</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="ca" d="M45 20H240V110H170V65H45Z"/><text class="n" x="260" y="70">union</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="ca" d="M25 10H270V118H145V75H25Z"/><text class="n" x="285" y="72">same notch law</text></g></g>
</svg>

