<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C05 Physical end of s</title><desc id="d">A physical endpoint creates a cap with constant terminal station.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#fde68a;stroke:#b45309;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:4;stroke-dasharray:10 8}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.stop{stroke:#be185d;stroke-width:7}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fff7ed;stroke:#d97706;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C05 · Физический конец s · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON</text><path class="sk" d="M100 165H520"/><circle cx="520" cy="165" r="13" fill="#be185d"/><text class="n" x="545" y="170">physical END</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M100 105H520L590 165L520 225H100Z"/><text class="n" x="505" y="262">Cap closes strip</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><rect class="ca" x="100" y="105" width="420" height="120"/><path class="cb" d="M520 105L590 165L520 225Z"/><path class="dv" d="M520 105V225"/><text class="n" x="532" y="170">cap owner</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M100 165H520"/><path class="stop" d="M520 110V220"/><path stroke="#7c3aed" stroke-width="3" d="M180 140V190M280 140V190M380 140V190"/><text class="n" x="470" y="250">s=end constant on cap</text><text class="n" x="535" y="115">no extrapolation</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="sk" d="M45 62H285"/><circle cx="285" cy="62" r="8" fill="#be185d"/><text class="n" x="300" y="67">end</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="ca" d="M45 35H280L330 62L280 90H45Z"/><text class="n" x="118" y="116">cap born with strip</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="ca" d="M25 20H270L350 62L270 105H25Z"/><text class="n" x="120" y="122">s still stops at END</text></g></g>
</svg>

