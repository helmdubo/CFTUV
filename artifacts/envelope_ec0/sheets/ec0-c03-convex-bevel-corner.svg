<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C03 Convex BEVEL corner</title><desc id="d">BEVEL corner with V P1 P2 triangle and chord silhouette.</desc>
