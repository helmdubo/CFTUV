<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">EC0-C13 BEVEL collision with another wing of the same decal</title><desc id="d">A pChain wing of the same decal and Patch reaches the actual bevel chord only after mutual arrival.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker></defs>
  <style>.bg{fill:#f8fafc}.p{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 28px Arial;fill:#0f172a}.l{font:700 20px Arial;fill:#334155}.n{font:16px Arial;fill:#475569}.sk{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.ca{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.cb{fill:#bbf7d0;stroke:#15803d;stroke-width:3}.cc{fill:#fbcfe8;stroke:#be185d;stroke-width:3}.dv{fill:none;stroke:#d97706;stroke-width:5;stroke-dasharray:10 8}.ghost{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:10 8}.fl{fill:none;stroke:#7c3aed;stroke-width:5;marker-end:url(#arrow)}.mut{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.evt{fill:#fdf2f8;stroke:#be185d;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1000"/><text class="h" x="60" y="52">EC0-C13 · BEVEL + другая юбка той же decal/Patch · DEFINED</text>
  <g transform="translate(50 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">1 · SKELETON · ONE DECAL / ONE PATCH</text><path class="sk" d="M80 225H350V65M620 250L455 230"/><circle cx="350" cy="225" r="11" fill="#be185d"/><text class="n" x="430" y="265">another pChain wing → chord</text></g>
  <g transform="translate(820 80)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">2 · COVERAGE</text><path class="ca" d="M70 170H300V55H420V215L350 270H70Z"/><path class="cc" d="M300 215L420 215L350 270Z"/><path class="cb" d="M620 165L420 215L350 270L620 285Z"/><path class="ghost" d="M420 215Q480 270 350 300"/><text class="n" x="420" y="205">same-decal wing fills released wedge</text></g>
  <g transform="translate(50 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">3 · OWNERSHIP</text><path class="ca" d="M70 170H300V55H420V215H300V270H70Z"/><path class="cc" d="M300 215L420 215L350 270Z"/><path class="cb" d="M620 165L420 215L350 270L620 285Z"/><path stroke="#be185d" stroke-width="7" d="M420 215L350 270"/><text class="n" x="426" y="250">contact = actual chord</text></g>
  <g transform="translate(820 410)"><rect class="p" width="730" height="300" rx="14"/><text class="l" x="24" y="34">4 · UV / STATION FLOW</text><path class="fl" d="M80 225H350V65"/><path class="fl" d="M620 250L430 230"/><path class="dv" d="M420 215L350 270"/><text class="n" x="115" y="265">BEVEL s unchanged</text><text class="n" x="445" y="285">other-wing s stops at chord</text></g>
  <g transform="translate(50 740)"><rect class="p" width="1500" height="220" rx="14"/><text class="l" x="24" y="34">5 · ALPHA EVOLUTION</text><g transform="translate(80 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cc" d="M70 25L150 25L110 70Z"/><path class="cb" d="M330 70H245V105H350Z"/><text class="n" x="86" y="112">before mutual arrival</text></g><g transform="translate(560 62)"><rect class="evt" width="380" height="125" rx="10"/><path class="cc" d="M90 25L180 25L135 80Z"/><path class="cb" d="M340 55L180 25L135 80L340 100Z"/><text class="n" x="112" y="118">first chord contact</text></g><g transform="translate(1040 62)"><rect class="mut" width="380" height="125" rx="10"/><path class="cc" d="M70 15L190 15L130 95Z"/><path class="cb" d="M365 35L190 15L130 95L365 112Z"/><text class="n" x="78" y="123">no fan / no apex orbit</text></g></g>
</svg>
