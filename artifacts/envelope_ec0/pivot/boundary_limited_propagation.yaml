schema: cftuv.envelope.ec0.boundary_policy.v1
policy_id: BOUNDARY_LIMITED_PROPAGATION
status: DEFINED
scope: FIRST_ENVELOPE_BACKEND_RELEASE
semantic_contracts:
  - id: BLP-S1
    authority: USER_REQUIRED
    rule: Outer boundary, hole loops, and ChainUses explicitly carrying BARRIER are fixed non-owner PatchDomain constraints.
  - id: BLP-S2
    authority: USER_REQUIRED
    rule: One FrontComponent exists per ChainUse, owner Patch, and sector; all components of one Patch are evaluated together.
  - id: BLP-S3
    authority: MATHEMATICALLY_REQUIRED
    rule: Boundary contact occurs at an exact event before crossing; rollback from outside the domain is forbidden.
  - id: BLP-S4
    authority: USER_REQUIRED
    rule: Active intervals may clip, shrink, slide along the same boundary component, collapse, or freeze without increasing branch count.
  - id: BLP-S5
    authority: USER_REQUIRED
    rule: Propagation requiring obstacle split, path choice, or later merge saturates with BARRIER_SPLIT_REQUIRED at the last proven effective alpha.
  - id: BLP-S6
    authority: USER_REQUIRED
    rule: Capacity of one FrontComponent does not stop another component, another pChain, the opposite patch-side use, or the whole Patch.
  - id: BLP-S7
    authority: MATHEMATICALLY_REQUIRED
    rule: Front completion is determined by active intervals, never by first or last runtime vertex identity.
  - id: BLP-S8
    authority: USER_REQUIRED
    rule: Boolean clipping without source reachability and boundary event history cannot authorize material behind an obstacle.
domain_constraints:
  outer_boundary: {kind: FIXED_BARRIER, owner: NONE}
  hole_loops: {kind: FIXED_BARRIER, owner: NONE}
  rail_chain_use:
    kind: FIXED_BARRIER_ONLY_IF_ROLE_PRESENT
    required_role: BARRIER
front_component:
  identity: [CHAIN_USE, OWNER_PATCH, SECTOR]
  active_intervals: REQUIRED
  branch_count: NON_INCREASING
  boundary_event_history: REQUIRED
  requested_alpha: PRESERVED
  effective_alpha: PER_COMPONENT
allowed_transitions:
  - BOUNDARY_CONTACT
  - INTERVAL_CLIP
  - INTERVAL_SHRINK
  - CONTACT_SLIDE_SAME_BOUNDARY_COMPONENT
  - INTERVAL_COLLAPSE
  - FRONT_EXHAUSTED
  - COMPETITION_FREEZE
capacity:
  trigger: BARRIER_SPLIT_REQUIRED
  effective_state: LAST_PROVEN_UNAMBIGUOUS_STATE
  capability_outcome: BARRIER_BYPASS_UNSUPPORTED
  user_status: BOUNDARY_CAPACITY_REACHED
  scope: AFFECTED_FRONT_COMPONENT_ONLY
pipeline:
  - PATCH_DOMAIN
  - LOCAL_ENVELOPE_CONTRIBUTIONS
  - BOUNDARY_LIMITED_RESOLVER
  - BOUNDARY_RESOLVED_CONTRIBUTIONS
  - PATCH_PRIMITIVE_UNION
  - PATCH_COVERAGE_CLAIMS
  - INTRA_PATCH_FRONT_INTERACTION
  - RESOLVED_PATCH_COVERAGE
  - OWNERSHIP
forbidden:
  - FIRST_OR_LAST_FRONT_VERTEX_CAPACITY_CRITERION
  - BOUNDARY_CROSS_THEN_ROLLBACK
  - ACTIVE_BRANCH_COUNT_INCREASE
  - LEFT_RIGHT_OBSTACLE_PATH_CHOICE
  - MERGE_BEHIND_OBSTACLE
  - MATERIAL_TELEPORTS_BEHIND_HOLE_OR_BARRIER
  - UNMARKED_RAIL_ACTS_AS_BARRIER
  - ONE_COMPONENT_STOPS_OPPOSITE_PATCH_SIDE
  - ONE_COMPONENT_STOPS_OTHER_PCHAIN
  - ONE_COMPONENT_STOPS_WHOLE_PATCH
scenarios:
  - id: BLP-01
    title: Straight outer-boundary contact
    domain_features: [OUTER_BOUNDARY]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: APPROACHING_BOUNDARY}
    exact_event: {events: [BOUNDARY_CONTACT], after_state: CLIPPED_NO_CROSSING}
    beyond_requested: {state: INTERVAL_SHRINKS_OR_CONTINUES_ALONG_BOUNDARY}
    forbidden: [ROLLBACK_FROM_OUTSIDE]
  - id: BLP-02
    title: Sliding contact on an oblique boundary
    domain_features: [OBLIQUE_OUTER_BOUNDARY]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: FREE_GROWTH}
    exact_event: {events: [BOUNDARY_CONTACT], after_state: ONE_ENDPOINT_CLIPPED}
    beyond_requested: {state: CONTACT_SLIDES_AND_INTERVAL_SHORTENS, branch_count: ONE}
    forbidden: [GLOBAL_STOP_AT_FIRST_CONTACT]
  - id: BLP-03
    title: Front exhaustion in a narrow sector
    domain_features: [NARROW_SECTOR, OUTER_BOUNDARIES]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: SHRINKING}
    exact_event: {events: [INTERVAL_COLLAPSE, FRONT_EXHAUSTED], after_state: NO_ACTIVE_INTERVALS}
    beyond_requested: {state: SUCCESSFULLY_EXHAUSTED}
    forbidden: [SILENT_DISAPPEARANCE]
  - id: BLP-04
    title: First contact with a hole
    domain_features: [HOLE_LOOP]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: APPROACHING_HOLE}
    exact_event: {events: [BOUNDARY_CONTACT], after_state: TANGENT_HOLE_CONTACT}
    beyond_requested: {state: CONTACT_SLIDES_OR_REACHES_PRECOMPILED_BARRIER_SPLIT_EVENT}
    forbidden: [CROSS_HOLE_INTERIOR]
  - id: BLP-05
    title: Hole requires a branch split
    domain_features: [HOLE_LOOP]
    components: [PRIMARY]
    before: {active_intervals: ONE, branch_count: ONE}
    exact_event: {events: [BARRIER_SPLIT_REQUIRED, SATURATION], after_state: LAST_UNAMBIGUOUS_STATE}
    beyond_requested: {state: CAPACITY_FROZEN, requested_alpha: GREATER_THAN_EFFECTIVE_ALPHA}
    forbidden: [TWO_BYPASS_BRANCHES, MERGE_BEHIND_HOLE, MATERIAL_BEHIND_HOLE]
  - id: BLP-06
    title: Concave outer boundary requires a branch split
    domain_features: [CONCAVE_OUTER_BOUNDARY]
    components: [PRIMARY]
    before: {active_intervals: ONE, branch_count: ONE}
    exact_event: {events: [BARRIER_SPLIT_REQUIRED, SATURATION], after_state: LAST_UNAMBIGUOUS_STATE}
    beyond_requested: {state: CAPACITY_FROZEN, requested_alpha: GREATER_THAN_EFFECTIVE_ALPHA}
    forbidden: [CONCAVITY_BYPASS_BRANCHES, MATERIAL_TELEPORTS_ACROSS_NOTCH]
  - id: BLP-07
    title: Simultaneous contact with two boundaries
    domain_features: [TWO_FIXED_BOUNDARIES]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: APPROACHING_BOTH}
    exact_event: {events: [BOUNDARY_CONTACT_LEFT, BOUNDARY_CONTACT_RIGHT], application: ATOMIC_BATCH}
    beyond_requested: {state: SHRINK_OR_EXHAUST_WITHOUT_ORDER_DEPENDENCE}
    forbidden: [EVENT_ENUMERATION_CHANGES_RESULT]
  - id: BLP-08
    title: Barrier rail inside a Patch
    domain_features: [RAIL_CHAIN_USE_WITH_BARRIER_ROLE]
    components: [PRIMARY]
    before: {active_intervals: ONE, state: APPROACHING_BARRIER_RAIL}
    exact_event: {events: [BOUNDARY_CONTACT], after_state: CLIPPED_AT_MARKED_BARRIER}
    beyond_requested: {state: BARRIER_SPLIT_REQUIRED_IF_BYPASS_NEEDED}
    forbidden: [PASS_THROUGH_BARRIER, UNMARKED_RAIL_BLOCKS_FRONT]
  - id: BLP-09
    title: Two wings of one physical chain remain independent across Patches
    domain_features: [PHYSICAL_CHAIN_BETWEEN_PATCH_A_AND_PATCH_B]
    components: [WING_A, WING_B]
    before: {wing_a: APPROACHING_BOUNDARY, wing_b: FREE_GROWTH}
    exact_event: {events: [WING_A_BOUNDARY_CAPACITY], wing_b: UNAFFECTED}
    beyond_requested: {wing_a: EFFECTIVE_ALPHA_FROZEN, wing_b: CONTINUES}
    forbidden: [PHYSICAL_CHAIN_GLOBAL_STOP]
  - id: BLP-10
    title: Another pChain in the same Patch continues
    domain_features: [ONE_PATCH, TWO_PCHAIN_SOURCES]
    components: [PRIMARY, COMPANION]
    before: {primary: APPROACHING_CAPACITY, companion: FREE_GROWTH}
    exact_event: {events: [PRIMARY_BOUNDARY_CAPACITY], companion: UNAFFECTED}
    beyond_requested: {primary: EFFECTIVE_ALPHA_FROZEN, companion: CONTINUES}
    forbidden: [PATCH_GLOBAL_STOP]
canonical_digest_projection:
  include: [policy_id, domain_constraints, front_component, allowed_transitions, capacity, scenarios, boundary_event_history, requested_alpha, effective_alpha]
  exclude: [runtime_front_vertices, tessellation, sampled_contact_order, ui_error_color]
visuals:
  svg: artifacts/envelope_ec0/pivot/ec0-p-boundary-limited-propagation.svg
  png: artifacts/envelope_ec0/pivot/ec0-p-boundary-limited-propagation.png
