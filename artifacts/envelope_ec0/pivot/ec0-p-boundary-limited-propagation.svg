<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" role="img" aria-labelledby="t d">
  <title id="t">EC0-P Boundary-limited propagation v1</title><desc id="d">Ten scenarios show before, exact boundary event, and requested alpha beyond event or capacity.</desc>
  <style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#94a3b8;stroke-width:2}.h{font:700 27px Arial;fill:#0f172a}.title{font:700 18px Arial;fill:#1e293b}.label{font:14px Arial;fill:#475569}.tiny{font:12px Arial;fill:#64748b}.front{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round}.continue{fill:none;stroke:#15803d;stroke-width:6;stroke-linecap:round}.boundary{fill:none;stroke:#d97706;stroke-width:5}.barrier{fill:none;stroke:#be185d;stroke-width:6;stroke-dasharray:8 6}.ghost{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:7 6}.contact{fill:#d97706}.stop{fill:#be185d}.sep{stroke:#cbd5e1;stroke-width:1}.patch{fill:#e2e8f0;fill-opacity:.45;stroke:#94a3b8;stroke-width:1.5}.hole{fill:#f8fafc;stroke:#d97706;stroke-width:4}.cap{fill:#fdf2f8;stroke:#be185d;stroke-width:2}</style>
  <rect class="bg" width="1600" height="1280"/><text class="h" x="55" y="45">EC0-P · BOUNDARY_LIMITED_PROPAGATION · 10 canonical scenarios</text>

  <g transform="translate(40 70)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-01 · Straight outer-boundary contact</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before</text><path class="front" d="M40 125H175"/><path class="boundary" d="M210 75V175"/><text class="tiny" x="270" y="55">exact event</text><path class="front" d="M285 125H440"/><path class="boundary" d="M440 75V175"/><circle class="contact" cx="440" cy="125" r="7"/><text class="tiny" x="520" y="55">beyond requested</text><path class="front" d="M535 125H690"/><path class="boundary" d="M690 75V175"/><text class="label" x="545" y="195">clip · no crossing</text></g>

  <g transform="translate(810 70)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-02 · Sliding contact on oblique boundary</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before</text><path class="front" d="M35 135H175"/><path class="boundary" d="M205 70L165 185"/><text class="tiny" x="270" y="55">exact event</text><path class="front" d="M275 135H182" transform="translate(250 0)"/><path class="boundary" d="M455 70L415 185"/><circle class="contact" cx="432" cy="135" r="7"/><text class="tiny" x="520" y="55">beyond requested</text><path class="front" d="M525 120H650"/><path class="boundary" d="M705 70L665 185"/><circle class="contact" cx="682" cy="135" r="7"/><text class="label" x="540" y="195">interval shortens</text></g>

  <g transform="translate(40 305)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-03 · Exhaustion in a narrow sector</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before</text><path class="boundary" d="M55 80L205 115M55 180L205 145"/><path class="front" d="M80 130H170"/><text class="tiny" x="270" y="55">exact event</text><path class="boundary" d="M305 80L455 115M305 180L455 145"/><circle class="contact" cx="430" cy="130" r="8"/><text class="tiny" x="520" y="55">beyond requested</text><path class="boundary" d="M555 80L705 115M555 180L705 145"/><text class="label" x="565" y="135">FRONT_EXHAUSTED</text><text class="tiny" x="560" y="165">success · no silent loss</text></g>

  <g transform="translate(810 305)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-04 · First contact with a hole</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before</text><path class="front" d="M35 130H125"/><rect class="hole" x="165" y="90" width="55" height="80" rx="8"/><text class="tiny" x="270" y="55">exact event</text><path class="front" d="M285 130H415"/><rect class="hole" x="415" y="90" width="55" height="80" rx="8"/><circle class="contact" cx="415" cy="130" r="7"/><text class="tiny" x="520" y="55">beyond requested</text><rect class="hole" x="665" y="90" width="55" height="80" rx="8"/><path class="barrier" d="M535 130H655"/><text class="tiny" x="535" y="190">precompiled next event</text></g>

  <g transform="translate(40 540)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-05 · Hole requires split</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before · 1 branch</text><path class="front" d="M35 130H130"/><rect class="hole" x="165" y="85" width="60" height="90" rx="8"/><text class="tiny" x="270" y="55">exact capacity</text><path class="front" d="M285 130H415"/><rect class="hole" x="415" y="85" width="60" height="90" rx="8"/><circle class="stop" cx="415" cy="130" r="8"/><text class="tiny" x="520" y="55">requested &gt; effective</text><rect class="hole" x="665" y="85" width="60" height="90" rx="8"/><path class="ghost" d="M535 130H630M630 130Q650 85 665 85M630 130Q650 175 665 175"/><path class="barrier" d="M625 75V185"/><text class="label" x="525" y="205">BARRIER_SPLIT_REQUIRED</text></g>

  <g transform="translate(810 540)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-06 · Concave outer boundary requires split</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before · 1 branch</text><path class="front" d="M35 130H130"/><path class="boundary" d="M190 75V105H155V155H190V185"/><text class="tiny" x="270" y="55">exact capacity</text><path class="front" d="M285 130H405"/><path class="boundary" d="M440 75V105H405V155H440V185"/><circle class="stop" cx="405" cy="130" r="8"/><text class="tiny" x="520" y="55">no notch bypass</text><path class="ghost" d="M535 130H620M620 130Q650 95 690 95M620 130Q650 165 690 165"/><path class="barrier" d="M620 75V185"/><text class="label" x="545" y="205">capacity frozen</text></g>

  <g transform="translate(40 775)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-07 · Simultaneous contact with two boundaries</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">before</text><path class="boundary" d="M55 80H215M55 180H215"/><path class="front" d="M80 130H190"/><text class="tiny" x="270" y="55">exact atomic batch</text><path class="boundary" d="M305 105H465M305 155H465"/><path class="front" d="M330 130H440"/><circle class="contact" cx="385" cy="105" r="7"/><circle class="contact" cx="385" cy="155" r="7"/><text class="tiny" x="520" y="55">order independent</text><path class="boundary" d="M555 105H715M555 155H715"/><path class="front" d="M590 130H680"/><text class="label" x="560" y="195">one event batch</text></g>

  <g transform="translate(810 775)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-08 · Barrier rail inside one Patch</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">BARRIER role</text><path class="front" d="M35 130H135"/><path class="barrier" d="M175 75V185"/><text class="tiny" x="270" y="55">exact contact</text><path class="front" d="M285 130H425"/><path class="barrier" d="M425 75V185"/><circle class="stop" cx="425" cy="130" r="8"/><text class="tiny" x="520" y="55">no pass-through</text><path class="front" d="M535 130H675"/><path class="barrier" d="M675 75V185"/><text class="label" x="545" y="195">role-gated barrier</text></g>

  <g transform="translate(40 1010)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-09 · Two patch-side wings remain independent</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">same physical chain</text><rect class="patch" x="30" y="75" width="90" height="110"/><rect class="patch" x="130" y="75" width="90" height="110"/><path class="boundary" d="M125 70V190"/><path class="front" d="M55 130H115"/><path class="continue" d="M145 130H205"/><text class="tiny" x="270" y="55">wing A capacity</text><path class="front" d="M285 130H390"/><path class="barrier" d="M390 85V175"/><path class="continue" d="M415 130H475"/><text class="tiny" x="520" y="55">wing B continues</text><path class="front" d="M535 130H625"/><path class="barrier" d="M625 85V175"/><path class="continue" d="M650 130H720"/><text class="label" x="540" y="205">no physical-chain stop</text></g>

  <g transform="translate(810 1010)"><rect class="card" width="750" height="220" rx="14"/><text class="title" x="20" y="30">BLP-10 · Another pChain in the same Patch continues</text><path class="sep" d="M250 45V205M500 45V205"/><text class="tiny" x="20" y="55">two components</text><path class="front" d="M35 105H155"/><path class="continue" d="M35 160H185"/><text class="tiny" x="270" y="55">primary capacity</text><path class="front" d="M285 105H410"/><path class="barrier" d="M410 75V135"/><path class="continue" d="M285 160H465"/><text class="tiny" x="520" y="55">companion continues</text><path class="front" d="M535 105H660"/><path class="barrier" d="M660 75V135"/><path class="continue" d="M535 160H720"/><text class="label" x="545" y="205">no Patch-global stop</text></g>
</svg>
